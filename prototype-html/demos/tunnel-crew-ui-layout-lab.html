function drawSlicerPreviews(){
  if(!slicer.img) return;
  const gc = document.getElementById('slGuide');
  if(gc){
    const c = gc.getContext('2d'); const W = gc.width, H = gc.height;
    c.clearRect(0,0,W,H);
    const k = Math.min(W/slicer.natural.w, H/slicer.natural.h);
    const dw = slicer.natural.w*k, dh = slicer.natural.h*k, ox = (W-dw)/2, oy = (H-dh)/2;
    c.imageSmoothingEnabled = false;
    c.drawImage(slicer.img, ox, oy, dw, dh);
    c.strokeStyle = '#7fd8ff'; c.lineWidth = 1; c.setLineDash([4,3]);
    const L = ox + slicer.slice.left*k, R = ox + dw - slicer.slice.right*k;
    const T = oy + slicer.slice.top*k,  B = oy + dh - slicer.slice.bottom*k;
    c.beginPath();
    c.moveTo(L,oy); c.lineTo(L,oy+dh); c.moveTo(R,oy); c.lineTo(R,oy+dh);
    c.moveTo(ox,T); c.lineTo(ox+dw,T); c.moveTo(ox,B); c.lineTo(ox+dw,B);
    c.stroke(); c.setLineDash([]);
    c.strokeStyle = 'rgba(255,211,110,.85)'; c.strokeRect(ox+.5, oy+.5, dw-1, dh-1);
  }
  ['slSmall','slMid','slBig'].forEach(id=>{
    const cv = document.getElementById(id); if(!cv) return;
    const c = cv.getContext('2d');
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height); c.scale(2,2);
    const w = cv.width/2, h = cv.height/2;
    drawNineSlice(c, slicer.img, {x:0,y:0,w:w,h:h}, slicer.slice, {
      centerMode:slicer.centerMode, edgeMode:slicer.edgeMode, borderScale:slicer.borderScale, alpha:1 });
    c.fillStyle = 'rgba(243,235,255,.9)'; c.font = '600 11px system-ui'; c.textAlign = 'center';
    c.fillText(`${Math.round(w)}×${Math.round(h)}`, w/2, h/2 + 4);
  });
}

/* ════════════════════════════════════════════════════════════════════════
   12. IMPORT / EXPORT / PERSISTENCE
   ════════════════════════════════════════════════════════════════════════ */
function stripRuntime(o){
  if(Array.isArray(o)) return o.map(stripRuntime);
  if(o && typeof o === 'object'){
    const out = {};
    for(const k in o){ if(k.charAt(0) === '_') continue; out[k] = stripRuntime(o[k]); }
    return out;
  }
  return o;
}
/* scenes 에서 실제 사용 중인 스킨 정의를 함께 내보내 JSON을 자기설명적으로 만든다 */
function usedSkins(){
  const used = new Set();
  Object.values(S.data.scenes).forEach(sc=>sc.modules.forEach(m=>{
    used.add(m.skinId);
    Object.values(m.states || {}).forEach(st=>{ if(st.skinId) used.add(st.skinId); });
  }));
  const out = {};
  used.forEach(id=>{
    const sk = SkinRegistry.get(id); if(!sk) return;
    const def = stripRuntime(sk);
    if(sk.generated) delete def.src;               // dataURL 은 저장하지 않는다
    out[id] = def;
  });
  Object.keys(S.data.skins || {}).forEach(id=>{ out[id] = stripRuntime(S.data.skins[id]); });
  return out;
}
function exportConfig(){
  return {
    schema: SCHEMA_ID,
    exportedAt: new Date().toISOString(),
    viewport: deepClone(S.data.viewport),
    theme: { tokens: deepClone(S.data.theme.tokens) },
    skins: usedSkins(),
    scenes: stripRuntime(deepClone(S.data.scenes))
  };
}

function validateConfig(raw){
  const errs = [];
  if(!raw || typeof raw !== 'object'){ errs.push('최상위 값이 객체가 아닙니다'); return { errs }; }
  if(raw.schema !== SCHEMA_ID) errs.push(`schema 불일치: "${raw.schema}" (기대값 "${SCHEMA_ID}")`);
  const out = defaultState();
  out.scenes = {};

  if(raw.viewport && typeof raw.viewport === 'object'){
    const v = raw.viewport;
    out.viewport.width  = clamp(Math.round(+v.width  || 1920), 240, 4096);
    out.viewport.height = clamp(Math.round(+v.height || 1080), 240, 4096);
    out.viewport.preset = typeof v.preset === 'string' ? v.preset : 'custom';
    out.viewport.safeArea = SAFE_AREAS[v.safeArea] ? v.safeArea : 'none';
    if(v.width && !(+v.width > 0)) errs.push('viewport.width 값이 잘못되어 기본값을 사용합니다');
  } else errs.push('viewport 누락 — 기본값 사용');

  if(raw.theme && raw.theme.tokens) out.theme.tokens = deepMerge(deepClone(DEFAULT_TOKENS), raw.theme.tokens);

  out.skins = {};
  if(raw.skins && typeof raw.skins === 'object'){
    Object.keys(raw.skins).forEach(id=>{
      const d = raw.skins[id];
      if(!d || typeof d !== 'object'){ errs.push(`skins.${id}: 객체가 아님 — 건너뜀`); return; }
      if(BUILTIN_SKINS[id]) return;                       // 내장 스킨은 코드 정의 유지
      if(d.renderer === 'image'){
        if(!d.generated && !isPortablePath(d.src)){ errs.push(`skins.${id}.src: 프로젝트 상대 경로가 아님 — 건너뜀`); return; }
        d.slice = d.slice || { left:0, top:0, right:0, bottom:0 };
      }
      out.skins[id] = d;
    });
  }

  const scenes = raw.scenes && typeof raw.scenes === 'object' ? raw.scenes : null;
  if(!scenes){ errs.push('scenes 누락 — 기본 화면을 사용합니다'); out.scenes = defaultScenes(); }
  else {
    Object.keys(scenes).forEach(sid=>{
      const sc = scenes[sid];
      if(!sc || !Array.isArray(sc.modules)){ errs.push(`scenes.${sid}: modules 배열 없음 — 건너뜀`); return; }
      const seen = new Set();
      const list = [];
      sc.modules.forEach((raw2, i)=>{
        if(!raw2 || typeof raw2 !== 'object'){ errs.push(`scenes.${sid}.modules[${i}]: 객체가 아님 — 건너뜀`); return; }
        const id = String(raw2.id || ('module-' + i));
        if(seen.has(id)){ errs.push(`scenes.${sid}.modules[${i}]: id "${id}" 중복 — 건너뜀`); return; }
        const type = MODULE_TYPES[raw2.type] ? raw2.type : 'panel';
        if(!MODULE_TYPES[raw2.type]) errs.push(`scenes.${sid}.${id}: 알 수 없는 type "${raw2.type}" → panel 로 대체`);
        /* deepMerge 로 알 수 없는 필드까지 보존한다 */
        const m = deepMerge(baseModule(id, type), raw2);
        m.id = id; m.type = type;
        if(!m.rect || typeof m.rect !== 'object'){ m.rect = { x:4,y:4,w:20,h:10 }; errs.push(`scenes.${sid}.${id}: rect 손상 → 기본값`); }
        ['x','y','w','h'].forEach(k=>{ if(!isFinite(+m.rect[k])){ errs.push(`scenes.${sid}.${id}.rect.${k}: 숫자가 아님 → 0`); m.rect[k] = 0; } else m.rect[k] = r3(+m.rect[k]); });
        if(ANCHORS.indexOf(m.anchor) < 0){ errs.push(`scenes.${sid}.${id}: 알 수 없는 anchor "${m.anchor}" → top-left`); m.anchor = 'top-left'; }
        if(STATE_KEYS.indexOf(m.previewState) < 0) m.previewState = 'default';
        m.z = isFinite(+m.z) ? +m.z : 10;
        m.opacity = clamp(isFinite(+m.opacity) ? +m.opacity : 1, 0, 1);
        m.visible = m.visible !== false; m.locked = !!m.locked;
        if(m.content && m.content.iconPath && !isPortablePath(m.content.iconPath)){
          errs.push(`scenes.${sid}.${id}: iconPath 가 이식 불가 경로 → 제거`); m.content.iconPath = '';
        }
        seen.add(id); list.push(m);
      });
      out.scenes[sid] = { label: typeof sc.label === 'string' ? sc.label : sid, modules:list };
    });
    if(!Object.keys(out.scenes).length){ errs.push('유효한 scene 이 없어 기본 화면을 사용합니다'); out.scenes = defaultScenes(); }
  }
  return { state:out, errs };
}
function importConfig(raw, opts){
  const { state, errs } = validateConfig(raw);
  if(!state){ toast('불러오기 실패: ' + errs.join(' / '), true); return { ok:false, errors:errs }; }
  S.data = state;
  SkinRegistry.setUser(S.data.skins || {});
  if(!S.data.scenes[S.ui.sceneId]) S.ui.sceneId = Object.keys(S.data.scenes)[0];
  S.ui.sel = [];
  NineSliceCache.clear(); _tintCache.clear();
  applyViewportInputs(); fullRender();
  if(!(opts && opts.silent)) History.push();
  return { ok:true, errors:errs };
}

let _saveTimer = 0;
function scheduleSave(){                      /* 드래그 중 반복 저장 금지 · 250ms debounce */

}
function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(exportConfig()));
    S.ui.dirty = false;
    $('#stSave').textContent = '자동 저장됨 ' + new Date().toLocaleTimeString('ko-KR', {hour12:false});
  }catch(e){
    $('#stSave').textContent = '저장 실패';
    console.warn('localStorage 저장 실패', e);
  }
}
function loadLocal(){
  let txt = null;
  try{ txt = localStorage.getItem(STORAGE_KEY); }catch(_){ return false; }
  if(!txt) return false;
  try{
    const r = importConfig(JSON.parse(txt), { silent:true });
    if(r.errors && r.errors.length) console.warn('저장본 복구 경고:', r.errors);
    return r.ok;
  }catch(e){ console.warn('저장본 파싱 실패', e); return false; }
}

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('클립보드에 복사했습니다'), ()=>fallbackCopy(t));
  } else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t;
  ta.style.cssText = 'position:fixed;left:-9999px'; document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('클립보드에 복사했습니다'); }
  catch(_){ toast('복사에 실패했습니다. 텍스트를 직접 선택하세요', true); }
  ta.remove();
}

function renderSceneList(){

function renderTree(){
  const box = el.tree; box.innerHTML = '';
  const q = S.ui.search.trim().toLowerCase();
  const list = mods().slice().sort((a,b)=>b.z - a.z);
  let shown = 0;
  list.forEach(m=>{
    if(q && !(m.id.toLowerCase().includes(q) || (m.name||'').toLowerCase().includes(q) || m.type.toLowerCase().includes(q))) return;
    shown++;
    const r = document.createElement('div');
    r.className = 'trow' + (S.ui.sel.includes(m.id) ? ' sel' : '') + (m.visible ? '' : ' isHidden') + (m.locked ? ' isLocked' : '');
    r.setAttribute('role','treeitem'); r.tabIndex = 0;
    r.setAttribute('aria-selected', S.ui.sel.includes(m.id) ? 'true' : 'false');
    if(m.parentId) r.style.paddingLeft = '14px';
    const vb = document.createElement('button');
    vb.textContent = m.visible ? '👁' : '🚫'; vb.title = m.visible ? '숨기기' : '표시';
    vb.setAttribute('aria-label', (m.visible?'숨기기 ':'표시 ') + m.id);
    vb.addEventListener('click', e=>{ e.stopPropagation(); m.visible = !m.visible; commitEdit(); renderTree(); });
    const lb = document.createElement('button');
    lb.textContent = m.locked ? '🔒' : '🔓'; lb.title = m.locked ? '잠금 해제' : '잠금';
    if(m.locked) lb.className = 'act';
    lb.setAttribute('aria-label', (m.locked?'잠금 해제 ':'잠금 ') + m.id);
    lb.addEventListener('click', e=>{ e.stopPropagation(); m.locked = !m.locked; commitEdit(); renderTree(); });
    const nm = document.createElement('span'); nm.className = 'tname'; nm.textContent = m.name || m.id;
    nm.title = m.id;
    const ty = document.createElement('span'); ty.className = 'ttype'; ty.textContent = 'z' + m.z;
    r.appendChild(vb); r.appendChild(lb); r.appendChild(nm); r.appendChild(ty);
    r.addEventListener('click', e=>select([m.id], e.shiftKey));
    r.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); select([m.id], e.shiftKey); }
    });
    r.addEventListener('mouseenter', ()=>{ S.ui.hover = m.id; renderOverlay(); });
    r.addEventListener('mouseleave', ()=>{ if(S.ui.hover === m.id){ S.ui.hover = null; renderOverlay(); } });
    box.appendChild(r);
  });
  $('#treeCount').textContent = q ? `${shown} / ${mods().length}` : String(mods().length);
  if(!shown){ const d = document.createElement('div'); d.className = 'hint'; d.textContent = '일치하는 모듈이 없습니다.'; box.appendChild(d); }
}

/* ════════════════════════════════════════════════════════════════════════
   모듈 조작 (추가 / 복제 / 삭제 / 레이어)
   ════════════════════════════════════════════════════════════════════════ */
function uniqueId(base){
  let i = 2, id = base;
  while(mods().some(m=>m.id === id)) id = base + '-' + (i++);
  return id;
}
function addModule(type){
  const m = makeModule(uniqueId(type.replace(/([A-Z])/g,'-$1').toLowerCase()), type, 'top-left', 6, 6);
  m.z = Math.max(0, ...mods().map(x=>x.z)) + 1;
  mods().push(m);
  commitEdit(); select([m.id]); renderTree();
  toast('모듈 추가: ' + m.id);
}
function duplicateSelection(){
  const sel = selMods(); if(!sel.length) return;
  const created = [];
  sel.forEach(m=>{
    const c = deepClone(m);
    c.id = uniqueId(m.id.replace(/-copy(-\d+)?$/,'') + '-copy');
    const a = absOf(m); a.l += 1.5; a.t += 1.5;
    setAbs(c, a); c.z = m.z + 1; c.locked = false;
    mods().push(c); created.push(c.id);
  });
  commitEdit(); select(created); renderTree();
  toast(created.length + '개 복제');
}
function deleteSelection(){
  const sel = selMods().filter(m=>!m.locked);
  if(!sel.length){ toast('삭제할 수 있는 모듈이 없습니다 (잠금 확인)', true); return; }
  const ids = new Set(sel.map(m=>m.id));
  scene().modules = mods().filter(m=>!ids.has(m.id));
  S.ui.sel = [];
  ids.forEach(id=>{ const n = modEls.get(id); if(n){ n.remove(); modEls.delete(id); } });
  commitEdit(); renderTree(); renderInspector();
  toast(ids.size + '개 삭제');
}
function moveLayer(dir){
  const sel = selMods(); if(!sel.length) return;
  sel.forEach(m=>{ m.z = clamp(m.z + dir, -999, 999); });
  commitEdit(); renderTree();
}
function nudge(dx, dy){
  const sel = selMods().filter(m=>!m.locked); if(!sel.length) return;
  sel.forEach(m=>{ const p = modPx(m); setAbs(m, pxToAbs({ x:p.x+dx, y:p.y+dy, w:p.w, h:p.h })); });
  lightRender(); syncInspectorRect();
}

/* ════════════════════════════════════════════════════════════════════════
   13. KEYBOARD SHORTCUTS
   ════════════════════════════════════════════════════════════════════════ */
function typingInField(t){
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
}
let _nudgeTimer = 0;
window.addEventListener('keydown', e=>{
  const mod = e.ctrlKey || e.metaKey;
  if(e.key === 'Escape'){
    if($('#modalBack').classList.contains('on')){ closeModal(); return; }
    if(inlineTarget){ closeInline(false); return; }
    if(S.ui.sel.length){ select([]); return; }
  }
  if(typingInField(e.target)) return;
  if(mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? History.redo() : History.undo(); return; }
  if(mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); History.redo(); return; }
  if(mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicateSelection(); return; }
  if(mod && e.key.toLowerCase() === 's'){ e.preventDefault(); saveLocal(); toast('저장했습니다'); return; }
  if(mod && e.key.toLowerCase() === 'a'){ e.preventDefault(); select(mods().map(m=>m.id)); return; }
  if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSelection(); return; }
  const step = e.shiftKey ? 10 : 1;
  const map = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] };
  if(map[e.key]){
    e.preventDefault(); nudge(map[e.key][0], map[e.key][1]);
    clearTimeout(_nudgeTimer); _nudgeTimer = setTimeout(()=>History.push(), 340);  // 연속 이동은 1단계로
  }
});

/* ════════════════════════════════════════════════════════════════════════
   14. BOOTSTRAP AND PUBLIC API
   ════════════════════════════════════════════════════════════════════════ */
function applyViewportInputs(){
  $('#vpW').value = vpW(); $('#vpH').value = vpH();
  $('#vpPreset').value = VIEWPORTS.some(v=>v.id === S.data.viewport.preset) ? S.data.viewport.preset : 'custom';
  $('#safeArea').value = S.data.viewport.safeArea;
}
function setViewport(w, h, presetId){
  S.data.viewport.width  = clamp(Math.round(w), 240, 4096);
  S.data.viewport.height = clamp(Math.round(h), 240, 4096);
  S.data.viewport.preset = presetId || 'custom';
  applyViewportInputs(); NineSliceCache.clear(); fullRender(); History.push();
}
function bindToolbar(){
  const vs = $('#vpPreset');
  VIEWPORTS.forEach(v=>{ const o = document.createElement('option'); o.value = v.id; o.textContent = v.label; vs.appendChild(o); });
  vs.addEventListener('change', ()=>{
    const v = VIEWPORTS.find(x=>x.id === vs.value);
    if(!v || v.id === 'custom'){ S.data.viewport.preset = 'custom'; return; }
    setViewport(v.w, v.h, v.id);
  });
  const sa = $('#safeArea');
  Object.keys(SAFE_AREAS).forEach(k=>{ const o = document.createElement('option'); o.value = k; o.textContent = SAFE_AREAS[k].label; sa.appendChild(o); });
  sa.addEventListener('change', ()=>{ S.data.viewport.safeArea = sa.value; renderGuides(); History.push(); updateStatus(); });

  const commitVp = ()=>setViewport(+$('#vpW').value || vpW(), +$('#vpH').value || vpH(), 'custom');
  $('#vpW').addEventListener('change', commitVp);
  $('#vpH').addEventListener('change', commitVp);

  $('#zoomSel').addEventListener('change', ()=>{ S.ui.zoom = $('#zoomSel').value; layoutStage(); renderOverlay(); updateStatus(); });

  const tgl = (id, key, after)=>{
    $(id).addEventListener('click', ()=>{
      S.ui[key] = !S.ui[key];
      $(id).classList.toggle('on', S.ui[key]);
      $(id).setAttribute('aria-pressed', String(S.ui[key]));
      if(after) after();
    });
  };
  tgl('#btnGuides','guides', renderGuides);
  tgl('#btnSnap','snap');
  tgl('#btnSliceGuide','sliceGuide', ()=>renderStage());
  tgl('#btnPreview','preview', ()=>{ renderGuides(); renderOverlay(); });

  $('#btnUndo').addEventListener('click', ()=>History.undo());
  $('#btnRedo').addEventListener('click', ()=>History.redo());
  $('#btnSave').addEventListener('click', ()=>{ saveLocal(); toast('저장했습니다'); });
  $('#btnDownload').addEventListener('click', downloadJson);
  $('#btnUpload').addEventListener('click', ()=>$('#fileJson').click());
  $('#fileJson').addEventListener('change', ev=>{
    const f = ev.target.files && ev.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const r = importConfig(JSON.parse(fr.result));
        toast(r.errors.length ? `불러왔습니다 (경고 ${r.errors.length}건)` : '불러왔습니다');
        if(r.errors.length) console.warn('import 경고:', r.errors);
      }catch(e){ toast('JSON 파싱 실패: ' + e.message, true); }
    };
    fr.readAsText(f); ev.target.value = '';
  });
  $('#btnJson').addEventListener('click', ()=>{
    const txt = JSON.stringify(exportConfig(), null, 2);
    openModal('tunnel-crew-ui-layout-v1', txt, [
      { t:'클립보드 복사', cls:'primary', fn:()=>copyText($('#modalText').value) },
      { t:'붙여넣은 JSON 불러오기', fn:()=>{
          try{
            const r = importConfig(JSON.parse($('#modalText').value));
            const msg = $('#modalMsg');
            if(r.errors.length){ msg.className = 'bad'; msg.textContent = '경고:\n' + r.errors.join('\n'); }
            else { closeModal(); toast('불러왔습니다'); }
          }catch(e){ const msg = $('#modalMsg'); msg.className = 'bad'; msg.textContent = 'JSON 파싱 실패: ' + e.message; }
        } },
      { t:'닫기', fn:closeModal }
    ], false);
  });
  $('#btnReset').addEventListener('click', ()=>{
    openModal('초기화', '모든 화면 레이아웃과 테마를 기본값으로 되돌립니다.\n이 동작은 실행 취소(Ctrl+Z)로 복구할 수 있습니다.', [
      { t:'초기화 실행', cls:'danger', fn:()=>{
          S.data = defaultState(); SkinRegistry.setUser({}); S.ui.sel = [];
          if(!S.data.scenes[S.ui.sceneId]) S.ui.sceneId = 'gameHud';
          modEls.forEach(n=>n.remove()); modEls.clear();
          NineSliceCache.clear(); _tintCache.clear();
          applyViewportInputs(); fullRender(); History.push(); closeModal(); toast('초기화했습니다');
        } },
      { t:'취소', fn:closeModal }
    ], true);
  });
  $('#modalBack').addEventListener('click', e=>{ if(e.target === $('#modalBack')) closeModal(); });

  const at = $('#addType');
  MODULE_TYPE_IDS.forEach(id=>{ const o = document.createElement('option'); o.value = id; o.textContent = MODULE_TYPES[id].label + ' · ' + id; at.appendChild(o); });
  at.value = 'panel';
  $('#btnAdd').addEventListener('click', ()=>addModule(at.value));
  $('#btnDup').addEventListener('click', duplicateSelection);
  $('#btnDel').addEventListener('click', deleteSelection);
  $('#btnUp').addEventListener('click', ()=>moveLayer(1));
  $('#btnDown').addEventListener('click', ()=>moveLayer(-1));
  $('#btnAll').addEventListener('click', ()=>{ mods().forEach(m=>m.visible = true); commitEdit(); renderTree(); });
  $('#treeSearch').addEventListener('input', e=>{ S.ui.search = e.target.value; renderTree(); });
}

/* 스테이지 컨테이너 크기 변경 → fit 줌 재계산.
   창 리사이즈뿐 아니라 패널 접힘·기기 회전·부팅 직후 레이아웃 확정까지 포착한다. */
let _rsTimer = 0;
function relayoutSoon(){
  clearTimeout(_rsTimer);
  _rsTimer = setTimeout(()=>{
    const before = _scale;
    layoutStage();
    if(Math.abs(before - _scale) > 1e-4){ renderOverlay(); updateStatus(); }
  }, 60);
}
window.addEventListener('resize', relayoutSoon);
window.addEventListener('orientationchange', relayoutSoon);
if(window.ResizeObserver) new ResizeObserver(relayoutSoon).observe(el.stageWrap);
/* 이미지 로드 완료 → 해당 프레임에서 한 번만 다시 그림 */
let _imgTimer = 0;
ImageStore.onReady(()=>{ clearTimeout(_imgTimer); _imgTimer = setTimeout(()=>{ NineSliceCache.clear(); renderStage(); drawSlicerPreviews(); }, 30); });

/* ── applyConfig: 원본 게임 DOM 에 레이아웃/스타일만 적용 ──
   게임 상태 갱신 로직(updateResources 등)과 분리된다. */
function applyConfig(root, sceneId){
  const host = root || document;
  const sc = S.data.scenes[sceneId || S.ui.sceneId];
  if(!sc) return { applied:0, missing:[] };
  let applied = 0; const missing = [];
  sc.modules.forEach(m=>{
    const node = host.querySelector ? host.querySelector('#' + CSS.escape(m.id)) : null;
    if(!node){ missing.push(m.id); return; }
    const pos = posStyle(m);
    for(const k in pos) node.style[k] = pos[k];
    node.style.zIndex  = m.z;
    node.style.opacity = m.opacity;
    node.style.display = m.visible ? '' : 'none';
    node.style.transform = m.rotation ? `rotate(${m.rotation}deg)` : '';
    const vars = moduleVars(m);
    for(const k in vars) node.style.setProperty(k, vars[k]);
    node.dataset.skinId = m.skinId;
    let skinLayer = node.querySelector(':scope > .uiSkin, :scope > .tcSurface');
    if(skinLayer){
      const p = modPx(m);
      applyNineSlice(skinLayer, m.skinId, {
        bg:(m.colors && m.colors.bg) || null, border:(m.colors && m.colors.border) || null,
        radius:m.style.radius, borderScale:m.style.borderScale || 1,
        bgOpacity:m.style.bgOpacity, tint:m.style.tint, shadow:m.style.shadow,
        centerMode:m.style.centerMode, edgeMode:m.style.edgeMode, boxW:p.w, boxH:p.h
      });
    }
    applied++;
  });
  return { applied, missing };
}

/* ── 공개 API (명세 §14) ── */
window.TUNNEL_UI_LAB = {
  open(){ document.getElementById('app').style.display = 'grid'; layoutStage(); renderOverlay(); },
  close(){ document.getElementById('app').style.display = 'none'; },
  exportConfig,
  importConfig,
  applyConfig,
  reset(){ S.data = defaultState(); SkinRegistry.setUser({}); S.ui.sel = [];
           modEls.forEach(n=>n.remove()); modEls.clear();
           NineSliceCache.clear(); applyViewportInputs(); fullRender(); History.push(); },
  getState(){ return { data:deepClone(S.data), ui:deepClone(S.ui) }; },
  get skins(){ return SkinRegistry.all(); },
  registerSkin(id, def){ SkinRegistry.register(id, def); S.data.skins[id] = stripRuntime(def); NineSliceCache.clear(); fullRender(); },
  drawNineSlice,
  applyNineSlice,
  /* skinId → 현재 런타임에서 사용할 이미지 URL (내장 생성 텍스처 포함) */
  skinImageSrc(id){ return skinImageSrc(SkinRegistry.get(id)); },
  NineSliceCache,
  SCHEMA: SCHEMA_ID,
  STORAGE_KEY
};

/* ── 부트스트랩 ── */
function boot(){
  bindToolbar();
  const restored = loadLocal();
  applyViewportInputs();
  $('#zoomSel').value = S.ui.zoom;
  renderTabs();
  fullRender();
  History.init();
  /* 독립 데모는 open() 상태로 시작한다 (게임 통합 시 close() 후 메뉴에서 open) */
  if(restored) toast('이전 작업을 복구했습니다');
  console.info('[UI LAYOUT LAB] ready ·', SCHEMA_ID, '· window.TUNNEL_UI_LAB');
}
try{ boot(); }
catch(e){
  /* 편집기 오류가 나도 JSON 내보내기/초기화는 살아 있어야 한다 (명세 §16) */
  console.error('부트 실패', e);
  document.body.insertAdjacentHTML('afterbegin',
    '<div style="position:fixed;inset:auto 12px 12px 12px;z-index:999;background:#33191e;border:1px solid #6d3038;' +
    'padding:10px 14px;border-radius:9px">에디터 초기화 중 오류가 발생했습니다. 콘솔을 확인하세요. ' +
    'window.TUNNEL_UI_LAB.exportConfig() / .reset() 은 사용할 수 있습니다.</div>');
}
