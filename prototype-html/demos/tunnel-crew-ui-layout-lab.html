<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tunnel Crew · UI Layout Lab</title>
<!--
  Tunnel Crew UI Layout Lab
  ─────────────────────────
  독립 실행형 UI 전용 데모 모드. docs/UI_NINE_SLICE_EDITOR_HANDOFF.md 명세 구현.

  코드 구성 (파일 내 순서)
   1. Constants / schema / defaults
   2. NineSliceRegistry
   3. DOM nine-slice renderer      · applyNineSlice()
   4. Canvas nine-slice renderer   · drawNineSlice()
   5. Scene and module templates
   6. Editor state store
   7. History manager
   8. Stage renderer
   9. Selection / drag / resize controller
  10. Inspector builders
  11. Resource slice tester
  12. Import / export / persistence
  13. Keyboard shortcuts
  14. Bootstrap and public API      · window.TUNNEL_UI_LAB

  외부 CDN/네트워크 의존성 없음. 순수 HTML/CSS/JS.
-->
<style>
/* ═══════════════════════════════════════════════════════════
   A. 에디터 셸 (편집기 UI 전용 · 게임 UI 토큰과 분리)
   ═══════════════════════════════════════════════════════════ */
:root{
  --e-bg:#100d18; --e-panel:#191426; --e-panel2:#221b33; --e-panel3:#2b2340;
  --e-line:#372e4f; --e-line2:#4a3e68;
  --e-ink:#efe9fb; --e-dim:#a396bd; --e-dim2:#7b6f95;
  --e-accent:#ffd36e; --e-accent2:#7fd8ff; --e-good:#6fe0a6; --e-bad:#ff6b7a; --e-warn:#ffb048;
  --e-r:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--e-bg);color:var(--e-ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:13px;overflow:hidden;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--e-line);border-radius:var(--e-r);background:var(--e-panel2);padding:5px 9px;line-height:1.3;white-space:nowrap}
button:hover{border-color:var(--e-line2);background:var(--e-panel3)}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{border-color:var(--e-accent);background:#4a3a18;color:#ffe9b6}
button.primary{border-color:var(--e-accent);background:#6b511f;color:#fff3cf;font-weight:800}
button.danger{border-color:#6d3038;background:#3d1c22;color:#ffc4ca}
button.mini{padding:3px 6px;font-size:11px}
button.icon{padding:3px 6px;min-width:26px;text-align:center}
:where(button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--e-accent2);outline-offset:1px}
input[type=number],input[type=text],input[type=file],select,textarea{
  width:100%;padding:4px 6px;border:1px solid var(--e-line);border-radius:6px;background:#141020;min-width:0}
input[type=number]{-moz-appearance:textfield}
input[type=range]{width:100%;accent-color:var(--e-accent)}
input[type=color]{width:100%;height:26px;padding:1px;border:1px solid var(--e-line);border-radius:6px;background:#141020;cursor:pointer}
input[type=checkbox]{accent-color:var(--e-accent);width:15px;height:15px}
textarea{resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.45}
label{display:block;font-size:10.5px;color:var(--e-dim);margin:0 0 3px;letter-spacing:.01em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#332b48;border-radius:6px;border:2px solid var(--e-panel)}
::-webkit-scrollbar-track{background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:250px 1fr 328px;
  grid-template-areas:"top top top" "left stage right" "bar bar bar";height:100vh;height:100dvh}
#topbar{grid-area:top;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 11px;
  border-bottom:1px solid var(--e-line);background:var(--e-panel)}
#leftbar{grid-area:left;border-right:1px solid var(--e-line);background:var(--e-panel);
  display:flex;flex-direction:column;min-height:0}
#stageWrap{grid-area:stage;position:relative;overflow:auto;display:grid;place-items:center;padding:22px;
  background:
    linear-gradient(45deg,#171325 25%,transparent 25%) 0 0/24px 24px,
    linear-gradient(-45deg,#171325 25%,transparent 25%) 0 12px/24px 24px,
    linear-gradient(45deg,transparent 75%,#171325 75%) 12px -12px/24px 24px,
    linear-gradient(-45deg,transparent 75%,#171325 75%) -12px 0/24px 24px,
    #131020}
#rightbar{grid-area:right;border-left:1px solid var(--e-line);background:var(--e-panel);
  display:flex;flex-direction:column;min-height:0}
#statusbar{grid-area:bar;display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:5px 11px;
  border-top:1px solid var(--e-line);background:var(--e-panel);font-size:11px;color:var(--e-dim)}
.grow{flex:1}
.sep{width:1px;height:20px;background:var(--e-line);margin:0 1px;flex:none}
.tbLabel{font-size:10.5px;color:var(--e-dim2);letter-spacing:.06em;text-transform:uppercase}
#topbar select{width:auto;min-width:112px}

/* 좌측 · scene + 트리 */
.sideHead{display:flex;align-items:center;gap:5px;padding:8px 10px 5px;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--e-accent)}
.sideBox{padding:0 10px 9px;border-bottom:1px solid var(--e-line)}
#sceneList{display:flex;flex-direction:column;gap:2px;max-height:26vh;overflow:auto;padding-right:2px}
#sceneList button{display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;
  font-size:12px;padding:4px 7px;background:none;border-color:transparent}
#sceneList button:hover{background:var(--e-panel2);border-color:var(--e-line)}
#sceneList button.on{background:#3a2d14;border-color:var(--e-accent);color:#ffe9b6}
#sceneList .k{font-size:9.5px;color:var(--e-dim2);font-family:ui-monospace,Consolas,monospace}
#sceneList button.on .k{color:#d9b877}
#treeWrap{flex:1;overflow:auto;padding:0 10px 10px;min-height:0}
#tree{display:flex;flex-direction:column;gap:2px}
.trow{display:flex;align-items:center;gap:3px;padding:2px 3px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.trow:hover{background:var(--e-panel2)}
.trow.sel{background:#3a2d14;border-color:var(--e-accent)}
.trow .tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.trow .ttype{font-size:9px;color:var(--e-dim2);font-family:ui-monospace,Consolas,monospace}
.trow.sel .ttype{color:#d9b877}
.trow.isHidden .tname{opacity:.42;text-decoration:line-through}
.trow.isLocked .tname{color:var(--e-dim2)}
.trow button{background:none;border:none;padding:1px 3px;font-size:11px;opacity:.62;border-radius:4px;min-width:20px}
.trow button:hover{opacity:1;background:var(--e-panel3)}
.trow button.act{opacity:1;color:var(--e-accent)}
.treeTools{display:flex;flex-wrap:wrap;gap:3px;margin:7px 0 0}
.treeTools button{flex:1;font-size:10.5px;padding:4px 2px}

/* 우측 인스펙터 */
#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:7px 8px 0;border-bottom:1px solid var(--e-line)}
#tabs button{padding:4px 7px;font-size:10.5px;letter-spacing:.04em;border-bottom-left-radius:0;border-bottom-right-radius:0}
#tabs button.on{background:var(--e-panel3);border-color:var(--e-accent);color:#ffe9b6}
#insp{flex:1;overflow:auto;padding:11px;min-height:0}
#inspHead{padding:8px 11px 0;font-size:11px;color:var(--e-dim)}
#inspHead b{color:var(--e-ink);font-size:12.5px}
.grp{margin:0 0 13px}
.grp>h3{margin:0 0 6px;font-size:10px;letter-spacing:.1em;color:var(--e-accent);text-transform:uppercase;
  display:flex;align-items:center;gap:6px}
.grp>h3::after{content:"";flex:1;height:1px;background:var(--e-line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 6px;align-items:end}
.row.c1{grid-template-columns:1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
.row.c4{grid-template-columns:1fr 1fr 1fr 1fr}
.chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--e-ink);cursor:pointer;padding:3px 0}
.chk input{flex:none}
.hint{font-size:10.5px;color:var(--e-dim2);line-height:1.45;margin:4px 0 0}
.warnbox{border:1px solid #6d5320;background:#2e2412;color:#ffd9a0;border-radius:6px;padding:6px 8px;font-size:10.5px;line-height:1.45;margin:0 0 9px}
.warnbox.bad{border-color:#6d3038;background:#33191e;color:#ffc4ca}
.colorRow{display:grid;grid-template-columns:38px 1fr auto;gap:5px;align-items:center;margin:0 0 5px}
.colorRow input[type=color]{height:24px}
.colorRow input[type=text]{font-family:ui-monospace,Consolas,monospace;font-size:10.5px}
.colorRow .rst{padding:3px 5px;font-size:10px}
.segs{display:flex;gap:2px;flex-wrap:wrap}
.segs button{flex:1;padding:4px 3px;font-size:10.5px;min-width:0}
.anchorGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 0 5px}
.anchorGrid button{padding:0;height:26px;font-size:13px;line-height:1;color:var(--e-dim)}
.anchorGrid button.on{color:#ffe9b6}
.previewCanvasBox{background:
    linear-gradient(45deg,#1d1830 25%,transparent 25%) 0 0/16px 16px,
    linear-gradient(-45deg,#1d1830 25%,transparent 25%) 0 8px/16px 16px,
    linear-gradient(45deg,transparent 75%,#1d1830 75%) 8px -8px/16px 16px,
    linear-gradient(-45deg,transparent 75%,#1d1830 75%) -8px 0/16px 16px,#151122;
  border:1px solid var(--e-line);border-radius:6px;padding:7px;margin:0 0 7px;overflow:auto}
.previewCanvasBox canvas{display:block;max-width:100%}
.previewCanvasBox .cap{font-size:9.5px;color:var(--e-dim2);margin:0 0 4px;font-family:ui-monospace,Consolas,monospace}
.statePreview{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 8px}
.statePreview .sp{border:1px solid var(--e-line);border-radius:6px;padding:6px;background:#151122}
.statePreview .sp>.cap{font-size:9.5px;color:var(--e-dim2);margin:0 0 5px;text-transform:uppercase;letter-spacing:.06em}
.statePreview .sp.cur{border-color:var(--e-accent)}
.spStage{position:relative;height:38px}

/* ═══════════════════════════════════════════════════════════
   B. 스테이지 · 게임 UI 프리뷰 영역
   ═══════════════════════════════════════════════════════════ */
#stageSizer{position:relative;flex:none;box-shadow:0 20px 60px rgba(0,0,0,.55);touch-action:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--tk-bg,#0a0612);
  font-family:var(--tk-font-ui,"Pretendard","Malgun Gothic",sans-serif);color:var(--tk-text,#f3ebff)}
#stageBg{position:absolute;inset:0;background:
  radial-gradient(ellipse at 74% 26%,rgba(91,48,127,.34),transparent 44%),
  radial-gradient(ellipse at 28% 100%,rgba(47,22,68,.5),transparent 50%),
  linear-gradient(135deg,#08060c 0%,#0e0915 46%,#160c22 100%)}
#stageGuides{position:absolute;inset:0;pointer-events:none}
#modules{position:absolute;inset:0}

.uiMod{position:absolute;pointer-events:none;display:block}
.uiMod[data-hidden="1"]{display:none}
.uiSkin{position:absolute;inset:0;pointer-events:none}
.uiBody{position:absolute;inset:0;display:flex;min-width:0;min-height:0;
  padding:var(--m-pt) var(--m-pr) var(--m-pb) var(--m-pl);gap:var(--m-gap);z-index:1}
.uiMod *{box-sizing:border-box;min-width:0}
.uiSliceGuide{position:absolute;inset:0;pointer-events:none;z-index:3}
.uiSliceGuide i{position:absolute;background:rgba(127,216,255,.55)}

/* 게임 UI 공통 프리미티브 (테마 토큰 + 모듈 CSS 변수만 사용) */
.gTitle{font-size:var(--m-fs);font-weight:var(--m-fw);line-height:var(--m-lh);
  letter-spacing:var(--m-ls);color:var(--m-text);text-shadow:var(--m-tsh)}
.gTiny{font-size:calc(var(--m-fs) * .72);font-weight:700;line-height:1.25;color:var(--m-muted)}
.gNum{font-family:var(--tk-font-mono);font-size:calc(var(--m-fs) * 1.3);font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--m-text)}
.gBig{font-size:calc(var(--m-fs) * 1.7);font-weight:900;line-height:1.05;color:var(--m-text)}
.gAcc{color:var(--m-accent)}
.gEll{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gWrap{white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all}
.gGrow{flex:1;min-width:0}
.gRow{display:flex;align-items:center;gap:var(--m-gap);min-width:0}
.gCol{display:flex;flex-direction:column;gap:var(--m-gap);min-width:0}
.gGauge{height:var(--m-gaugeH);min-height:4px;border-radius:999px;background:rgba(255,255,255,.12);
  overflow:hidden;border:1px solid rgba(255,255,255,.1);flex:none}
.gGaugeFill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--m-gaugeA),var(--m-gaugeB))}
.gChip{display:flex;align-items:center;gap:calc(var(--m-gap) * .7);
  padding:calc(var(--m-gap) * .55) calc(var(--m-gap) * 1.1);
  border-radius:999px;border:1px solid var(--m-borderSoft);background:rgba(255,255,255,.05);min-width:0}
.gIcon{display:block;background-repeat:no-repeat;background-position:center;background-size:contain;flex:none}
.gIcon.fallback{border-radius:50%;background:var(--m-accent);border:1px solid rgba(255,255,255,.4)}
.gSlot{position:relative;border-radius:calc(var(--m-rad) * .55);border:1px solid var(--m-borderSoft);
  background:rgba(255,255,255,.055);display:grid;place-items:center;min-width:0;min-height:0}
.gSlot small{position:absolute;right:3px;bottom:2px;font-size:calc(var(--m-fs) * .62);font-weight:900;color:var(--m-text)}
.gBtn{display:flex;align-items:center;justify-content:center;gap:var(--m-gap);width:100%;height:100%;
  font-size:var(--m-fs);font-weight:var(--m-fw);color:var(--m-text);letter-spacing:var(--m-ls)}
.gKey{padding:calc(var(--m-gap) * .7) calc(var(--m-gap) * 1.2);border-radius:calc(var(--m-rad) * .5);
  background:var(--m-accent);color:#22142f;font-weight:950;font-size:var(--m-fs);flex:none;line-height:1.25}
.gListRow{display:flex;align-items:center;gap:var(--m-gap);padding:calc(var(--m-gap) * .7) var(--m-gap);
  border-radius:calc(var(--m-rad) * .5);border:1px solid var(--m-borderSoft);
  background:rgba(255,255,255,.04);min-width:0;flex:1}
.gListRow.cur{border-color:var(--m-accent);background:var(--m-accentSoft)}
.gGrid{display:grid;gap:var(--m-gap);min-height:0;flex:1}
.gCard{border:1px solid var(--m-borderSoft);background:rgba(255,255,255,.045);
  border-radius:calc(var(--m-rad) * .55);padding:var(--m-gap);display:flex;flex-direction:column;
  justify-content:space-between;gap:calc(var(--m-gap) * .45);min-width:0;overflow:hidden}
.gCard.cur{border-color:var(--m-accent);background:var(--m-accentSoft)}
.gNode{position:absolute;border-radius:50%;border:2px solid var(--m-accent);background:rgba(255,255,255,.08);
  display:grid;place-items:center;font-size:calc(var(--m-fs) * .78);font-weight:900;color:var(--m-text)}
.gLink{position:absolute;height:2px;background:var(--m-borderSoft);transform-origin:0 50%}
.gMini{position:absolute;inset:0;border-radius:calc(var(--m-rad) * .55);overflow:hidden;background:#0a0712}
.gMini canvas{width:100%;height:100%;display:block}

/* 스테이지 오버레이 · 선택 / 핸들 / 스냅 가이드 */
#overlay{position:absolute;inset:0;pointer-events:none;z-index:40}
#overlay .selBox{position:absolute;border:1.5px solid var(--e-accent);pointer-events:none}
#overlay .selBox.multi{border-style:dashed}
#overlay .hoverBox{position:absolute;border:1px dashed rgba(127,216,255,.6);pointer-events:none}
#overlay .lockBadge{position:absolute;font-size:10px;padding:0 4px;border-radius:4px;background:#3d3350;color:#cbbde4;
  transform:translateY(-100%);white-space:nowrap}
#overlay .hnd{position:absolute;width:11px;height:11px;margin:-6px 0 0 -6px;border:1px solid #1a1526;border-radius:2px;
  background:var(--e-accent);pointer-events:auto;touch-action:none}
#overlay .hnd::after{content:"";position:absolute;inset:-9px}
#overlay .hnd.n,#overlay .hnd.s{cursor:ns-resize}
#overlay .hnd.e,#overlay .hnd.w{cursor:ew-resize}
#overlay .hnd.nw,#overlay .hnd.se{cursor:nwse-resize}
#overlay .hnd.ne,#overlay .hnd.sw{cursor:nesw-resize}
#overlay .snapv{position:absolute;top:0;bottom:0;width:1px;background:#ff5fd0}
#overlay .snaph{position:absolute;left:0;right:0;height:1px;background:#ff5fd0}
#overlay .badge{position:absolute;font-family:ui-monospace,Consolas,monospace;font-size:10px;font-weight:800;
  background:rgba(26,21,38,.86);color:#ffe9b6;padding:1px 5px;border-radius:4px;white-space:nowrap}
#inlineEdit{position:absolute;z-index:60;display:none;pointer-events:auto;
  border:1.5px solid var(--e-accent);border-radius:4px;background:rgba(13,10,22,.95);color:#fff;padding:4px 6px;
  font-family:inherit;resize:none;line-height:1.3}

/* 가이드 라인 */
.gdLine{position:absolute;background:rgba(255,255,255,.10)}
.gdThird{position:absolute;background:rgba(255,255,255,.05)}
.gdSafe{position:absolute;border:1px dashed rgba(127,216,255,.4)}

/* 모달 */
#modalBack{position:fixed;inset:0;background:rgba(6,4,11,.86);display:none;place-items:center;z-index:200;padding:20px}
#modalBack.on{display:grid}
#modal{background:var(--e-panel);border:1px solid var(--e-line2);border-radius:11px;padding:15px;
  width:min(660px,100%);max-height:86vh;display:flex;flex-direction:column;gap:9px;box-shadow:0 24px 70px #000}
#modal h2{margin:0;font-size:14px}
#modal textarea{flex:1;min-height:260px}
#modalMsg{font-size:11px;line-height:1.5;color:var(--e-dim);white-space:pre-wrap;max-height:130px;overflow:auto}
#modalMsg.bad{color:var(--e-bad)}
#modalBtns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#241d36;border:1px solid var(--e-line2);
  color:var(--e-ink);padding:8px 14px;border-radius:9px;font-size:12px;z-index:300;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;box-shadow:0 10px 30px #000}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
#toast.bad{border-color:#6d3038;background:#33191e}

@media (max-width:1180px){ #app{grid-template-columns:206px 1fr 292px} }
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;
    grid-template-areas:"top" "left" "stage" "right" "bar"}
  #leftbar,#rightbar{border:0;border-top:1px solid var(--e-line);max-height:34vh}
  #stageWrap{padding:10px}
  #sceneList{max-height:16vh}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<div id="app">

  <!-- ── 상단 툴바 ────────────────────────────────────────── -->
  <div id="topbar">
    <strong style="font-size:13px;letter-spacing:.02em">UI LAYOUT LAB</strong>
    <span class="sep"></span>
    <span class="tbLabel">뷰포트</span>
    <select id="vpPreset" aria-label="뷰포트 프리셋"></select>
    <input type="number" id="vpW" style="width:74px" aria-label="뷰포트 너비" min="240" max="4096" step="1">
    <span style="color:var(--e-dim2)">×</span>
    <input type="number" id="vpH" style="width:74px" aria-label="뷰포트 높이" min="240" max="4096" step="1">
    <span class="sep"></span>
    <span class="tbLabel">안전영역</span>
    <select id="safeArea" aria-label="안전 영역 프리셋"></select>
    <span class="sep"></span>
    <span class="tbLabel">줌</span>
    <select id="zoomSel" aria-label="줌 배율">
      <option value="fit">맞춤</option><option value="0.25">25%</option><option value="0.5">50%</option>
      <option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option>
    </select>
    <span class="sep"></span>
    <button id="btnGuides" class="on" aria-pressed="true" title="가이드 / 3분할선 표시">가이드</button>

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════
   1. CONSTANTS / SCHEMA / DEFAULTS
   ════════════════════════════════════════════════════════════════════════ */
const SCHEMA_ID   = 'tunnel-crew-ui-layout-v1';
const STORAGE_KEY = 'tunnelCrew.uiLayoutLab.v1';
const HISTORY_MAX = 60;

/* 프로젝트 루트 기준 상대 경로 → 현재 문서 기준 URL.
   JSON에는 항상 프로젝트 상대 경로만 저장한다 (Blob URL / 절대 경로 금지). */
const ASSET_BASE = /\/demos\//i.test(location.pathname) ? '../' : './';
function resolveAssetPath(p){
  if(!p) return '';
  if(/^(data:|blob:|https?:)/i.test(p)) return p;   // 미리보기 전용 경로
  return ASSET_BASE + String(p).replace(/^\.?\//,'');
}
function isPortablePath(p){
  return !!p && !/^(data:|blob:|[a-zA-Z]:[\\/]|file:|\/\/)/i.test(p);
}

const DEFAULT_TOKENS = {
  color:{
    bg:'#0a0612', panel:'#1d122b', panelAlt:'#120b20', border:'#8f5fd0',
    text:'#f3ebff', textMuted:'#9c88b4', accent:'#7febd0', accentAlt:'#f06ab8',
    warning:'#ffb048', danger:'#ff6b76', success:'#6fe0a6'
  },
  font:{ ui:'Pretendard, Malgun Gothic, sans-serif', mono:'ui-monospace, Consolas, monospace' },

  radius:{ sm:7, md:12, lg:16 },
  motion:{ fast:100, normal:180 }
};

const VIEWPORTS = [
  { id:'1920x1080', label:'1920 × 1080', w:1920, h:1080 },
  { id:'1600x900',  label:'1600 × 900',  w:1600, h:900  },
  { id:'1366x768',  label:'1366 × 768',  w:1366, h:768  },
  { id:'1280x720',  label:'1280 × 720',  w:1280, h:720  },
  { id:'1024x768',  label:'1024 × 768',  w:1024, h:768  },
  { id:'844x390',   label:'844 × 390 · 모바일 가로', w:844, h:390 },
  { id:'390x844',   label:'390 × 844 · 모바일 세로', w:390, h:844 },
  { id:'custom',    label:'사용자 지정', w:0, h:0 }
];

/* 안전 영역: 논리 px 단위 인셋 */
const SAFE_AREAS = {
  none:      { label:'없음',              inset:{ l:0,  t:0,  r:0,  b:0  } },
  desktop:   { label:'데스크톱 16px',      inset:{ l:16, t:16, r:16, b:16 } },
  notchLand: { label:'모바일 노치 가로',   inset:{ l:44, t:12, r:44, b:21 } },
  portrait:  { label:'모바일 세로',        inset:{ l:12, t:47, r:12, b:34 } }
};

const ANCHORS = [
  'top-left','top-center','top-right',
  'center-left','center','center-right',
  'bottom-left','bottom-center','bottom-right',
  'stretch-x','stretch-y','stretch-both'
];
const ANCHOR_GLYPH = {
  'top-left':'↖','top-center':'↑','top-right':'↗',
  'center-left':'←','center':'✛','center-right':'→',
  'bottom-left':'↙','bottom-center':'↓','bottom-right':'↘',
  'stretch-x':'↔','stretch-y':'↕','stretch-both':'⤡'
};
const STATE_KEYS = ['default','hover','pressed','disabled','selected','warning','complete','failed'];
const STATE_LABEL = {
  default:'기본', hover:'호버', pressed:'눌림', disabled:'비활성',
  selected:'선택됨', warning:'경고', complete:'완료', failed:'실패'
};

/* 최소 크기 (논리 px) — 명세 §5 */
const MIN_SIZE_BY_KIND = { panel:{w:42,h:30}, text:{w:24,h:18}, icon:{w:16,h:16} };
const SNAP_TOL = 6;      // 스테이지 논리 px
const A11Y_MIN_FONT = 10;

/* ════════════════════════════════════════════════════════════════════════
   2. NINE-SLICE SKIN REGISTRY
   ────────────────────────────────────────────────────────────────────────
   모든 패널 배경은 skinId 를 통해서만 적용된다. renderer 를 'css' → 'image'
   로 바꾸는 것만으로 전체 UI가 PNG 9-Slice 로 교체되어야 한다.
   ════════════════════════════════════════════════════════════════════════ */
const BUILTIN_SKINS = {
  none:        { label:'없음',        renderer:'none' },
  simpleDark:  { label:'다크 글래스', renderer:'css',
                 fill:'linear-gradient(180deg,rgba(29,18,43,.92),rgba(13,8,23,.88))',
                 borderColor:'rgba(190,145,240,.46)', borderWidth:1, radius:12,
                 shadow:'0 7px 22px rgba(0,0,0,.32)', blur:8 },
  simplePaper: { label:'종이',        renderer:'css',
                 fill:'#f3c98f', borderColor:'#7b503c', borderWidth:2, radius:4,
                 shadow:'5px 5px 0 rgba(54,28,28,.8)', ink:'#583a2b', inkMuted:'#8a6249' },
  simpleDanger:{ label:'위험',        renderer:'css',
                 fill:'linear-gradient(180deg,rgba(58,16,24,.94),rgba(28,8,14,.9))',
                 borderColor:'rgba(255,107,118,.55)', borderWidth:1, radius:12,
                 shadow:'0 7px 22px rgba(40,0,8,.45)' },
  simpleButton:{ label:'버튼',        renderer:'css',
                 fill:'linear-gradient(180deg,rgba(58,40,84,.95),rgba(32,20,50,.95))',
                 borderColor:'rgba(205,165,245,.5)', borderWidth:1, radius:9,
                 shadow:'0 3px 0 rgba(10,5,20,.6)' },
  simpleSlot:  { label:'슬롯',        renderer:'css',
                 fill:'rgba(255,255,255,.055)', borderColor:'rgba(205,165,245,.35)',
                 borderWidth:1, radius:8, shadow:'none' },
  /* 절차적으로 생성한 128×128 9-Slice 이미지 스킨.
     외부 파일이 없어도 image 렌더러 경로 전체를 즉시 검증할 수 있다.
     내보내기 시 src(dataURL) 대신 generated:true 로 기록한다. */
  panelForge:  { label:'단조 패널 (이미지 9S)', renderer:'image', generated:'forge',
                 sourceSize:{w:128,h:128}, slice:{left:26,top:26,right:26,bottom:26},
                 borderScale:1, centerMode:'stretch', edgeMode:'stretch', fallback:'simpleDark' },
  panelRivet:  { label:'리벳 패널 (이미지 9S)', renderer:'image', generated:'rivet',
                 sourceSize:{w:96,h:96}, slice:{left:20,top:20,right:20,bottom:20},
                 borderScale:1, centerMode:'stretch', edgeMode:'tile', fallback:'simplePaper' }
};

/* 런타임 레지스트리: BUILTIN + 사용자 등록 스킨 */
const SkinRegistry = {
  _user:{},
  all(){ return Object.assign({}, BUILTIN_SKINS, this._user); },
  get(id){ return this._user[id] || BUILTIN_SKINS[id] || BUILTIN_SKINS.none; },
  has(id){ return !!(this._user[id] || BUILTIN_SKINS[id]); },
  register(id, def){ if(!id) return null; this._user[id] = Object.assign({}, def); return this._user[id]; },
  remove(id){ delete this._user[id]; },
  setUser(map){ this._user = {}; for(const k in map) if(!BUILTIN_SKINS[k]) this._user[k] = Object.assign({}, map[k]); },
  ids(){ return Object.keys(this.all()); }
};

/* ── 절차적 9-Slice 텍스처 생성기 (외부 리소스 없이 image 렌더러 검증용) ── */
const _genCache = {};
function generatedSkinSource(kind){
  if(_genCache[kind]) return _genCache[kind];
  const S = kind === 'rivet' ? 96 : 128;
  const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
  const c = cv.getContext('2d');
  const inset = kind === 'rivet' ? 20 : 26;
  if(kind === 'rivet'){
    c.fillStyle = '#e8bd80'; c.fillRect(0,0,S,S);
    c.fillStyle = '#f7d8a6'; c.fillRect(4,4,S-8,S-8);
    c.strokeStyle = '#7b503c'; c.lineWidth = 4; c.strokeRect(2,2,S-4,S-4);
    c.strokeStyle = 'rgba(123,80,60,.45)'; c.lineWidth = 2; c.strokeRect(11,11,S-22,S-22);
    c.fillStyle = '#8c5b42';
    [[9,9],[S-9,9],[9,S-9],[S-9,S-9]].forEach(([x,y])=>{
      c.beginPath(); c.arc(x,y,4,0,Math.PI*2); c.fill();
      c.fillStyle = '#c98f66'; c.beginPath(); c.arc(x-1,y-1,1.6,0,Math.PI*2); c.fill();
      c.fillStyle = '#8c5b42';
    });
  } else {
    const g = c.createLinearGradient(0,0,0,S);
    g.addColorStop(0,'#2a1b3f'); g.addColorStop(1,'#150d24');
    c.fillStyle = g; c.fillRect(0,0,S,S);
    c.strokeStyle = '#8f5fd0'; c.lineWidth = 3; c.strokeRect(1.5,1.5,S-3,S-3);
    c.strokeStyle = 'rgba(190,145,240,.34)'; c.lineWidth = 1; c.strokeRect(8.5,8.5,S-17,S-17);
    c.fillStyle = '#7febd0';
    const corner = (x,y,sx,sy)=>{ c.save(); c.translate(x,y); c.scale(sx,sy);
      c.fillRect(0,0,14,3); c.fillRect(0,0,3,14); c.fillRect(6,6,4,4); c.restore(); };
    corner(4,4,1,1); corner(S-4,4,-1,1); corner(4,S-4,1,-1); corner(S-4,S-4,-1,-1);
  }
  _genCache[kind] = cv.toDataURL('image/png');
  return _genCache[kind];
}
function skinImageSrc(skin){
  if(!skin) return '';
  if(skin.generated) return generatedSkinSource(skin.generated);
  return resolveAssetPath(skin.src);
}

/* ── 이미지 로더: 실패 시 CSS 스킨 폴백 ── */
const ImageStore = {
  map:new Map(),
  _listeners:[],
  onReady(fn){ this._listeners.push(fn); },
  get(src){
    if(!src) return null;
    let e = this.map.get(src);
    if(!e){
      e = { status:'loading', img:new Image(), src };
      this.map.set(src, e);
      e.img.onload  = ()=>{ e.status = e.img.naturalWidth ? 'ok' : 'error'; this._fire(src); };
      e.img.onerror = ()=>{ e.status = 'error'; this._fire(src); };
      try { e.img.src = src; } catch(_){ e.status = 'error'; }
    }
    return e;
  },
  ready(src){ const e = this.get(src); return e && e.status === 'ok' ? e.img : null; },
  _fire(src){ this._listeners.forEach(fn=>{ try{ fn(src); }catch(err){ console.warn(err); } }); }
};

/* ── 틴트 캐시: PNG 를 곱연산 색조로 물들인 오프스크린 캔버스 ── */
const _tintCache = new Map();
function getTintedImage(img, tint){
  if(!tint) return img;
  const key = (img.src ? img.src.slice(-120) : 'x') + '|' + tint;
  let cv = _tintCache.get(key);
  if(cv) return cv;
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if(!w || !h) return img;
  cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  c.drawImage(img,0,0);
  c.globalCompositeOperation = 'multiply'; c.fillStyle = tint; c.fillRect(0,0,w,h);
  c.globalCompositeOperation = 'destination-in'; c.drawImage(img,0,0);
  c.globalCompositeOperation = 'source-over';
  if(_tintCache.size > 40) _tintCache.clear();
  _tintCache.set(key, cv);
  return cv;
}

/* ════════════════════════════════════════════════════════════════════════
   3. DOM NINE-SLICE RENDERER  ·  applyNineSlice(el, skinId, overrides)
   ────────────────────────────────────────────────────────────────────────
   el         장식 전용 레이어 (.uiSkin). 콘텐츠 레이어와 분리되어 있으며
              선택 핸들은 이 레이어 바깥(#overlay)에 그려진다.
   overrides  { bg, border, radius, borderScale, bgOpacity, tint, shadow,
               centerMode, edgeMode, boxW, boxH }
   ════════════════════════════════════════════════════════════════════════ */
function applyNineSlice(el, skinId, overrides){
  if(!el) return { renderer:'none' };
  const ov   = overrides || {};
  const skin = SkinRegistry.get(skinId);
  const s    = el.style;

  /* 이전 상태 초기화 — 렌더러 전환 시 잔재가 남지 않도록 */
  s.background = 'none'; s.border = '0'; s.borderRadius = '0'; s.boxShadow = 'none';
  s.backdropFilter = ''; s.webkitBackdropFilter = '';
  s.borderImageSource = 'none'; s.borderImageSlice = ''; s.borderImageWidth = '';
  s.borderImageRepeat = ''; s.borderImageOutset = '0';
  s.opacity = (ov.bgOpacity == null ? 1 : ov.bgOpacity);

  if(skin.renderer === 'none'){ el.dataset.renderer = 'none'; return { renderer:'none' }; }

  if(skin.renderer === 'image'){
    const src = skinImageSrc(skin);
    const img = ImageStore.ready(src);
    if(img){
      const ss    = skin.sourceSize || { w:img.naturalWidth, h:img.naturalHeight };
      const sl    = skin.slice || { left:0, top:0, right:0, bottom:0 };
      const scale = ov.borderScale || skin.borderScale || 1;
      /* 코너가 서로 겹치지 않도록 border-width 를 박스 절반으로 클램프.
         border-image 는 코너를 늘리지 않고 축소만 하므로 형태가 유지된다. */
      const bw = ov.boxW || el.offsetWidth  || 9999;
      const bh = ov.boxH || el.offsetHeight || 9999;
      const kx = Math.min(1, bw / Math.max(1,(sl.left + sl.right)  * scale));
      const ky = Math.min(1, bh / Math.max(1,(sl.top  + sl.bottom) * scale));
      const k  = Math.min(1, kx, ky) * scale;
      const src2 = ov.tint ? getTintedImage(img, ov.tint).toDataURL('image/png') : src;
      const center = ov.centerMode || skin.centerMode || 'stretch';
      const edge   = ov.edgeMode   || skin.edgeMode   || 'stretch';
      const rep    = edge === 'tile' ? 'round' : 'stretch';
      s.borderStyle = 'solid';
      s.borderWidth = `${sl.top*k}px ${sl.right*k}px ${sl.bottom*k}px ${sl.left*k}px`;
      s.borderColor = 'transparent';
      s.borderImageSource = `url("${src2}")`;
      s.borderImageSlice  = `${sl.top} ${sl.right} ${sl.bottom} ${sl.left}` + (center === 'none' ? '' : ' fill');
      s.borderImageWidth  = `${sl.top*k}px ${sl.right*k}px ${sl.bottom*k}px ${sl.left*k}px`;
      s.borderImageRepeat = rep;
      if(ov.shadow) s.boxShadow = ov.shadow;
      el.dataset.renderer = 'image';
      /* 원본 크기 참고값 — 9-SLICE 탭 표시에 사용 */
      el.dataset.srcSize = ss.w + '×' + ss.h;
      return { renderer:'image', slice:sl, scale:k };
    }
    /* 로드 실패/대기 → CSS 스킨 폴백 */
    ImageStore.get(src);
    const fb = SkinRegistry.get(skin.fallback || 'simpleDark');
    el.dataset.renderer = 'image-fallback';
    return applyCssSkin(el, fb, ov);
  }

  el.dataset.renderer = 'css';
  return applyCssSkin(el, skin, ov);
}

function applyCssSkin(el, skin, ov){
  const s = el.style;
  let fill   = ov.bg     != null ? ov.bg     : (skin.fill || 'transparent');
  let border = ov.border != null ? ov.border : (skin.borderColor || 'transparent');
  if(ov.tint){
    fill   = `color-mix(in srgb, ${cssColorSafe(fill)} 62%, ${ov.tint})`;
    border = `color-mix(in srgb, ${border} 70%, ${ov.tint})`;
  }
  s.background   = fill;
  s.borderStyle  = 'solid';
  s.borderWidth  = ((skin.borderWidth == null ? 1 : skin.borderWidth) * (ov.borderScale || 1)) + 'px';
  s.borderColor  = border;
  s.borderRadius = (ov.radius != null ? ov.radius : (skin.radius || 0)) + 'px';
  s.boxShadow    = ov.shadow != null ? ov.shadow : (skin.shadow || 'none');
  if(skin.blur){ s.backdropFilter = `blur(${skin.blur}px)`; s.webkitBackdropFilter = `blur(${skin.blur}px)`; }
  return { renderer:'css', skin };
}
/* color-mix 는 gradient 를 받지 못하므로 gradient 는 틴트 대상에서 제외 */
function cssColorSafe(v){ return /gradient\(/i.test(v) ? '#1d122b' : v; }

/* ════════════════════════════════════════════════════════════════════════
   4. CANVAS NINE-SLICE RENDERER  ·  drawNineSlice(ctx, image, dest, slice, opt)
   ────────────────────────────────────────────────────────────────────────
   원본을 9영역으로 나눠 drawImage() 를 9회 호출한다. 코너는 절대 늘어나지
   않으며, 목적지가 인셋 합보다 작으면 코너를 비례 축소해 겹침을 막는다.
   opt = { centerMode:'stretch'|'tile'|'none', edgeMode:'stretch'|'tile',
           alpha, tint, borderScale, dpr }
   ════════════════════════════════════════════════════════════════════════ */
function drawNineSlice(ctx, image, dest, slice, opt){
  if(!ctx || !image) return false;
  const o  = opt || {};
  const sw = image.naturalWidth  || image.width;
  const sh = image.naturalHeight || image.height;
  if(!sw || !sh) return false;

  const sl = { left:+slice.left||0, top:+slice.top||0, right:+slice.right||0, bottom:+slice.bottom||0 };
  if(sl.left + sl.right >= sw || sl.top + sl.bottom >= sh){
    /* 인셋이 원본보다 큰 잘못된 값 → 안전하게 축소 */
    const fx = sw / Math.max(1, sl.left + sl.right + 1), fy = sh / Math.max(1, sl.top + sl.bottom + 1);
    sl.left *= fx; sl.right *= fx; sl.top *= fy; sl.bottom *= fy;
  }

  const dx = dest.x, dy = dest.y, dw = Math.max(1, dest.w), dh = Math.max(1, dest.h);
  const bs = o.borderScale || 1;
  let L = sl.left * bs, R = sl.right * bs, T = sl.top * bs, B = sl.bottom * bs;
  if(L + R > dw){ const f = dw / (L + R); L *= f; R *= f; }
  if(T + B > dh){ const f = dh / (T + B); T *= f; B *= f; }

  const img = o.tint ? getTintedImage(image, o.tint) : image;
  const centerMode = o.centerMode || 'stretch';
  const edgeMode   = o.edgeMode   || 'stretch';

  ctx.save();
  if(o.alpha != null) ctx.globalAlpha *= o.alpha;
  ctx.imageSmoothingEnabled = o.smooth !== false;

  const csw = sw - sl.left - sl.right, csh = sh - sl.top - sl.bottom;   // 원본 중앙 크기
  const cdw = dw - L - R,              cdh = dh - T - B;                // 목적지 중앙 크기

  const put = (sx,sy,sW,sH,ddx,ddy,dW,dH)=>{
    if(sW <= 0 || sH <= 0 || dW <= 0 || dH <= 0) return;
    ctx.drawImage(img, sx, sy, sW, sH, ddx, ddy, dW, dH);
  };
  const tile = (sx,sy,sW,sH,ddx,ddy,dW,dH,tileX,tileY)=>{
    if(sW <= 0 || sH <= 0 || dW <= 0 || dH <= 0) return;
    const stepX = tileX ? Math.max(1, sW * bs) : dW;
    const stepY = tileY ? Math.max(1, sH * bs) : dH;
    ctx.save(); ctx.beginPath(); ctx.rect(ddx, ddy, dW, dH); ctx.clip();
    for(let y = 0; y < dH; y += stepY){
      for(let x = 0; x < dW; x += stepX){
        put(sx, sy, sW, sH, ddx + x, ddy + y, Math.min(stepX, dW - x), Math.min(stepY, dH - y));
      }
    }
    ctx.restore();
  };

  /* 코너 4 — 절대 늘어나지 않는다 */
  put(0,               0,               sl.left,  sl.top,    dx,           dy,           L, T);
  put(sw - sl.right,   0,               sl.right, sl.top,    dx + dw - R,  dy,           R, T);
  put(0,               sh - sl.bottom,  sl.left,  sl.bottom, dx,           dy + dh - B,  L, B);
  put(sw - sl.right,   sh - sl.bottom,  sl.right, sl.bottom, dx + dw - R,  dy + dh - B,  R, B);

  /* 변 4 */
  if(edgeMode === 'tile'){
    tile(sl.left,      0,              csw,      sl.top,    dx + L,      dy,          cdw, T, true,  false);
    tile(sl.left,      sh - sl.bottom, csw,      sl.bottom, dx + L,      dy + dh - B, cdw, B, true,  false);
    tile(0,            sl.top,         sl.left,  csh,       dx,          dy + T,      L,   cdh, false, true);
    tile(sw - sl.right,sl.top,         sl.right, csh,       dx + dw - R, dy + T,      R,   cdh, false, true);
  } else {
    put(sl.left,       0,              csw,      sl.top,    dx + L,      dy,          cdw, T);
    put(sl.left,       sh - sl.bottom, csw,      sl.bottom, dx + L,      dy + dh - B, cdw, B);
    put(0,             sl.top,         sl.left,  csh,       dx,          dy + T,      L,   cdh);
    put(sw - sl.right, sl.top,         sl.right, csh,       dx + dw - R, dy + T,      R,   cdh);
  }

  /* 중앙 */
  if(centerMode === 'tile')        tile(sl.left, sl.top, csw, csh, dx + L, dy + T, cdw, cdh, true, true);
  else if(centerMode !== 'none')   put (sl.left, sl.top, csw, csh, dx + L, dy + T, cdw, cdh);

  ctx.restore();
  return true;
}

/* 오프스크린 캐시 — 같은 스킨/크기를 반복해서 9번 그리지 않는다.
   키: skinId|width|height|borderScale|tint|dpr  (명세 §6) */
const NineSliceCache = {
  map:new Map(), max:80,
  key(skinId,w,h,bs,tint,dpr){ return [skinId,Math.round(w),Math.round(h),bs,tint||'-',dpr].join('|'); },
  get(k){ return this.map.get(k) || null; },
  set(k,cv){ if(this.map.size >= this.max) this.map.delete(this.map.keys().next().value); this.map.set(k,cv); },
  clear(){ this.map.clear(); },
  /* 캐시된 캔버스를 얻는다. 실패 시 null → 호출측이 직접 drawNineSlice */
  panel(skinId, w, h, opt){
    const o = opt || {}, dpr = o.dpr || 1;
    const skin = SkinRegistry.get(skinId);
    if(skin.renderer !== 'image') return null;
    const img = ImageStore.ready(skinImageSrc(skin));
    if(!img) return null;
    const bs = o.borderScale || skin.borderScale || 1;
    const k  = this.key(skinId, w, h, bs, o.tint, dpr);
    const hit = this.get(k); if(hit) return hit;
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
    const c = cv.getContext('2d'); c.scale(dpr, dpr);
    drawNineSlice(c, img, {x:0,y:0,w:w,h:h}, skin.slice || {left:0,top:0,right:0,bottom:0}, {
      centerMode:o.centerMode || skin.centerMode, edgeMode:o.edgeMode || skin.edgeMode,
      borderScale:bs, tint:o.tint, alpha:1
    });
    this.set(k, cv);
    return cv;
  }
};
/* ════════════════════════════════════════════════════════════════════════
   5. SCENE AND MODULE TEMPLATES
   ════════════════════════════════════════════════════════════════════════ */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp = (v,a,b)=> v < a ? a : (v > b ? b : v);
const r3 = v => Math.round((+v || 0) * 1000) / 1000;
const deepClone = o => JSON.parse(JSON.stringify(o));
function deepMerge(base, patch){
  if(patch === null || patch === undefined) return base;
  if(Array.isArray(patch) || typeof patch !== 'object') return patch;
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for(const k in patch){
    const b = out[k], p = patch[k];
    out[k] = (b && p && typeof b === 'object' && typeof p === 'object' && !Array.isArray(p)) ? deepMerge(b, p) : p;
  }
  return out;
}

/* 콘텐츠 상태(빈/최대/긴 텍스트) 샘플 변형 */
function csText(m, txt, longTxt){
  const st = m.content && m.content.contentState;
  if(st === 'empty') return '';
  if(st === 'long')  return longTxt || (txt + ' — 아주 긴 텍스트가 들어왔을 때 줄바꿈과 말줄임이 어떻게 처리되는지 확인하는 문장입니다.');
  return txt;
}
function csNum(m, v, max){
  const st = m.content && m.content.contentState;
  if(st === 'empty') return 0;
  if(st === 'max')   return max != null ? max : v;
  return v;
}
function iconStyle(m, sizeFallback){
  const c = m.content || {};
  const sz = c.iconSize || sizeFallback || 18;
  const p  = c.iconPath ? resolveAssetPath(c.iconPath) : '';
  const ok = p && ImageStore.ready(p);
  const tr = [];
  if(c.iconOffsetX) tr.push(`translateX(${c.iconOffsetX}px)`);
  if(c.iconOffsetY) tr.push(`translateY(${c.iconOffsetY}px)`);
  let st = `width:${sz}px;height:${sz}px;opacity:${c.iconOpacity == null ? 1 : c.iconOpacity};`;
  if(tr.length) st += `transform:${tr.join(' ')};`;
  if(c.iconTint) st += `filter:drop-shadow(0 0 0 ${c.iconTint});`;
  if(p){ ImageStore.get(p); if(ok) st += `background-image:url("${p}");`; }
  return { style:st, cls: ok ? 'gIcon' : 'gIcon fallback' };
}
function ic(m, size){ const i = iconStyle(m, size); return `<span class="${i.cls}" style="${i.style}" aria-hidden="true"></span>`; }
function currencyIcon(m, name, size){
  const p = resolveAssetPath('assets/ui/currency/currency-' + name + '.png');
  ImageStore.get(p);
  const ok = ImageStore.ready(p);
  const sz = (m.content && m.content.iconSize) || size || 18;
  return `<span class="gIcon${ok?'':' fallback'}" aria-hidden="true" style="width:${sz}px;height:${sz}px;${ok?`background-image:url("${p}");`:''}"></span>`;
}
function gauge(v, extra){
  return `<div class="gGauge"${extra||''}><div class="gGaugeFill" style="width:${clamp((+v||0)*100,0,100)}%"></div></div>`;
}
function lines(m, fallback){
  const raw = (m.content && m.content.items != null) ? m.content.items : fallback;
  return String(raw||'').split('\n').map(s=>s.trim()).filter(Boolean);
}

      return s + '</div>'; } }

const MODULE_TYPE_IDS = Object.keys(MODULE_TYPES);

/* ── 모듈 기본값 ────────────────────────────────────────────────────── */
function baseModule(id, type){
  const t = MODULE_TYPES[type] || MODULE_TYPES.panel;
  const d = t.def || {};
  const base = {
    id, type, name:'', parentId:null,
    rect:{ x:4, y:4, w:20, h:10 },
    anchor:'top-left', z:10, rotation:0, opacity:1,
    visible:true, locked:false, keepAspect:false,
    minSize:null, maxSize:null,
    skinId:'simpleDark',
    layout:{ padding:[9,9,9,9], gap:7, direction:'row', align:'center', justify:'flex-start', overflow:'hidden' },
    style:{ bgOpacity:1, tint:null, borderScale:1, radius:null, shadow:null,
            centerMode:null, edgeMode:null },
    typography:{ font:'ui', size:12, weight:850, lineHeight:1.15, letterSpacing:-0.02,
                 align:'left', valign:'center', color:null, shadow:false, wrap:'ellipsis', uppercase:false },
    colors:{ bg:null, border:null, text:null, textMuted:null, accent:null,
             success:null, warning:null, danger:null, gaugeFrom:null, gaugeTo:null },
    content:{ contentState:'normal' },
    states:{}, previewState:'default'
  };
  const merged = deepMerge(base, d);
  merged.id = id; merged.type = type;
  merged.name = merged.name || t.label;
  return merged;
}
function makeModule(id, type, anchor, x, y, over){
  const m = baseModule(id, type);
  m.anchor = anchor || m.anchor;
  const d = (MODULE_TYPES[type].def || {}).rect || {};
  m.rect = { x:r3(x), y:r3(y), w:r3(d.w != null ? d.w : m.rect.w), h:r3(d.h != null ? d.h : m.rect.h) };
  return over ? deepMerge(m, over) : m;
}

function findMod(id){ return mods().find(m=>m.id===id) || null; }
function selMods(){ return S.ui.sel.map(findMod).filter(Boolean); }
function primary(){ return S.ui.sel.length ? findMod(S.ui.sel[S.ui.sel.length-1]) : null; }
function tokens(){ return S.data.theme.tokens; }
function vpW(){ return S.data.viewport.width; }
function vpH(){ return S.data.viewport.height; }

/* 상태(hover/pressed/...) 오버라이드가 반영된 렌더용 모듈 */
function effective(m){
  const k = m.previewState || 'default';
  if(k === 'default' || !m.states || !m.states[k]) return m;
  return deepMerge(m, m.states[k]);
}

/* ════════════════════════════════════════════════════════════════════════
   7. HISTORY MANAGER  (최소 50단계 · 드래그는 pointerup 에서 1단계)
   ════════════════════════════════════════════════════════════════════════ */
const History = {
  stack:[], idx:-1,
  snap(){ return JSON.stringify(S.data); },
  init(){ this.stack = [this.snap()]; this.idx = 0; updateStatus(); },
  push(){
    const s = this.snap();
    if(s === this.stack[this.idx]) return;
    this.stack = this.stack.slice(0, this.idx + 1);
    this.stack.push(s);
    while(this.stack.length > HISTORY_MAX) this.stack.shift();
    this.idx = this.stack.length - 1;
    S.ui.dirty = true; scheduleSave(); updateStatus();
  },
  _apply(s){
    S.data = JSON.parse(s);
    SkinRegistry.setUser(S.data.skins || {});
    if(!S.data.scenes[S.ui.sceneId]) S.ui.sceneId = Object.keys(S.data.scenes)[0];
    S.ui.sel = S.ui.sel.filter(id=>findMod(id));
    NineSliceCache.clear();
    fullRender(); S.ui.dirty = true; scheduleSave(); updateStatus();
  },
  undo(){ if(this.idx <= 0){ toast('더 되돌릴 항목이 없습니다'); return; } this.idx--; this._apply(this.stack[this.idx]); },
  redo(){ if(this.idx >= this.stack.length-1){ toast('더 다시 실행할 항목이 없습니다'); return; } this.idx++; this._apply(this.stack[this.idx]); }
};

/* ════════════════════════════════════════════════════════════════════════
   좌표계 · 앵커 (명세 §5)
   rect 는 앵커 기준 오프셋(%)이며 abs 는 스테이지 절대 %(l,t,w,h).
   앵커를 바꿔도 화면상의 위치가 변하지 않도록 abs 를 유지한 채 rect 를 재계산.
   ════════════════════════════════════════════════════════════════════════ */
const ANCHOR_MODE = {
  'top-left':['left','top'],      'top-center':['center','top'],      'top-right':['right','top'],
  'center-left':['left','middle'],'center':['center','middle'],       'center-right':['right','middle'],
  'bottom-left':['left','bottom'],'bottom-center':['center','bottom'],'bottom-right':['right','bottom'],
  'stretch-x':['stretch','top'],  'stretch-y':['left','stretch'],     'stretch-both':['stretch','stretch']
};
function amode(a){ return ANCHOR_MODE[a] || ANCHOR_MODE['top-left']; }

function rectToAbs(anchor, r){
  const [hm,vm] = amode(anchor); let l,w,t,h;
  if(hm === 'stretch'){ l = r.x; w = 100 - r.x - r.w; }
  else if(hm === 'center'){ w = r.w; l = 50 + r.x - r.w/2; }
  else if(hm === 'right'){ w = r.w; l = 100 - r.x - r.w; }
  else { l = r.x; w = r.w; }
  if(vm === 'stretch'){ t = r.y; h = 100 - r.y - r.h; }
  else if(vm === 'middle'){ h = r.h; t = 50 + r.y - r.h/2; }
  else if(vm === 'bottom'){ h = r.h; t = 100 - r.y - r.h; }
  else { t = r.y; h = r.h; }
  return { l:r3(l), t:r3(t), w:r3(w), h:r3(h) };
}
function absToRect(anchor, a){
  const [hm,vm] = amode(anchor); let x,w,y,h;
  if(hm === 'stretch'){ x = a.l; w = 100 - a.l - a.w; }
  else if(hm === 'center'){ w = a.w; x = a.l + a.w/2 - 50; }
  else if(hm === 'right'){ w = a.w; x = 100 - a.l - a.w; }
  else { x = a.l; w = a.w; }
  if(vm === 'stretch'){ y = a.t; h = 100 - a.t - a.h; }
  else if(vm === 'middle'){ h = a.h; y = a.t + a.h/2 - 50; }
  else if(vm === 'bottom'){ h = a.h; y = 100 - a.t - a.h; }
  else { y = a.t; h = a.h; }
  return { x:r3(x), y:r3(y), w:r3(w), h:r3(h) };
}
const absOf   = m => rectToAbs(m.anchor, m.rect);
const setAbs  = (m,a) => { m.rect = absToRect(m.anchor, a); };
/* 논리 px ↔ 절대 % */
const absToPx = a => ({ x:a.l/100*vpW(), y:a.t/100*vpH(), w:a.w/100*vpW(), h:a.h/100*vpH() });
const pxToAbs = p => ({ l:p.x/vpW()*100, t:p.y/vpH()*100, w:p.w/vpW()*100, h:p.h/vpH()*100 });
const modPx   = m => absToPx(absOf(m));

/* 최소 크기 (논리 px) — 9-Slice 인셋 합보다 작아지지 않도록 보정 */
function minSizePx(m){
  const kind = (MODULE_TYPES[m.type] || MODULE_TYPES.panel).kind || 'panel';
  const base = MIN_SIZE_BY_KIND[kind] || MIN_SIZE_BY_KIND.panel;
  let w = base.w, h = base.h;
  const sk = SkinRegistry.get(m.skinId);
  if(sk.renderer === 'image' && sk.slice){
    const bs = (m.style && m.style.borderScale) || sk.borderScale || 1;
    w = Math.max(w, (sk.slice.left + sk.slice.right) * bs + 2);
    h = Math.max(h, (sk.slice.top + sk.slice.bottom) * bs + 2);
  }
  if(m.minSize){ w = Math.max(w, m.minSize.w || 0); h = Math.max(h, m.minSize.h || 0); }
  return { w, h };
}
function maxSizePx(m){
  return { w:(m.maxSize && m.maxSize.w) || vpW()*4, h:(m.maxSize && m.maxSize.h) || vpH()*4 };
}

/* ════════════════════════════════════════════════════════════════════════
   8. STAGE RENDERER
   ════════════════════════════════════════════════════════════════════════ */
let _scale = 1;
function stageScale(){
  if(S.ui.zoom !== 'fit') return +S.ui.zoom || 1;
  const pad = 44;
  const aw = Math.max(80, el.stageWrap.clientWidth  - pad);
  const ah = Math.max(80, el.stageWrap.clientHeight - pad);
  return Math.min(aw / vpW(), ah / vpH(), 2);
}
function layoutStage(){
  _scale = stageScale();
  el.stage.style.width  = vpW() + 'px';
  el.stage.style.height = vpH() + 'px';
  el.stage.style.transform = `scale(${_scale})`;
  el.sizer.style.width  = (vpW() * _scale) + 'px';
  el.sizer.style.height = (vpH() * _scale) + 'px';
}
function applyThemeVars(){
  const tk = tokens(), s = el.stage.style;
  s.setProperty('--tk-bg',        tk.color.bg);
  s.setProperty('--tk-panel',     tk.color.panel);
  s.setProperty('--tk-panelAlt',  tk.color.panelAlt);
  s.setProperty('--tk-border',    tk.color.border);
  s.setProperty('--tk-text',      tk.color.text);
  s.setProperty('--tk-textMuted', tk.color.textMuted);
  s.setProperty('--tk-accent',    tk.color.accent);
  s.setProperty('--tk-accentAlt', tk.color.accentAlt);
  s.setProperty('--tk-warning',   tk.color.warning);
  s.setProperty('--tk-danger',    tk.color.danger);
  s.setProperty('--tk-success',   tk.color.success || '#6fe0a6');
  s.setProperty('--tk-font-ui',   tk.font.ui);
  s.setProperty('--tk-font-mono', tk.font.mono);
  el.stage.style.background = tk.color.bg;
}
function moduleVars(m){
  const tk = tokens(), c = m.colors || {}, t = m.typography || {}, l = m.layout || {};
  const sk = SkinRegistry.get(m.skinId);
  const rad = (m.style && m.style.radius != null) ? m.style.radius : (sk.radius || 10);
  const p = l.padding || [8,8,8,8];
  return {
    '--m-fs':(t.size||12)+'px', '--m-fw':String(t.weight||850),
    '--m-lh':String(t.lineHeight||1.15), '--m-ls':(t.letterSpacing||0)+'em',
    '--m-tsh':t.shadow ? '0 1px 2px rgba(0,0,0,.75)' : 'none',
    '--m-text':c.text || tk.color.text,
    '--m-muted':c.textMuted || tk.color.textMuted,
    '--m-accent':c.accent || tk.color.accent,
    '--m-accentSoft':`color-mix(in srgb, ${c.accent||tk.color.accent} 16%, transparent)`,
    '--m-border':c.border || tk.color.border,
    '--m-borderSoft':`color-mix(in srgb, ${c.border||tk.color.border} 52%, transparent)`,
    '--m-gaugeA':c.gaugeFrom || tk.color.accent,
    '--m-gaugeB':c.gaugeTo   || tk.color.accentAlt,
    '--m-warning':c.warning || tk.color.warning,
    '--m-danger':c.danger  || tk.color.danger,
    '--m-rad':rad+'px', '--m-gap':(l.gap==null?7:l.gap)+'px',
    '--m-pt':p[0]+'px','--m-pr':p[1]+'px','--m-pb':p[2]+'px','--m-pl':p[3]+'px',
    '--m-gaugeH':((m.content && m.content.gaugeH) || 10)+'px'
  };
}
function posStyle(m){
  const a = absOf(m), [hm,vm] = amode(m.anchor), o = {};
  if(hm === 'stretch'){ o.left = a.l+'%'; o.right = r3(100-a.l-a.w)+'%'; o.width = 'auto'; }
  else if(hm === 'right'){ o.right = r3(100-a.l-a.w)+'%'; o.width = a.w+'%'; o.left = 'auto'; }
  else { o.left = a.l+'%'; o.width = a.w+'%'; o.right = 'auto'; }
  if(vm === 'stretch'){ o.top = a.t+'%'; o.bottom = r3(100-a.t-a.h)+'%'; o.height = 'auto'; }
  else if(vm === 'bottom'){ o.bottom = r3(100-a.t-a.h)+'%'; o.height = a.h+'%'; o.top = 'auto'; }
  else { o.top = a.t+'%'; o.height = a.h+'%'; o.bottom = 'auto'; }
  return o;
}
function applyPos(node, m){ const o = posStyle(m); for(const k in o) node.style[k] = o[k]; }

function buildModule(m){
  const node = document.createElement('div');
  node.className = 'uiMod';
  node.dataset.id = m.id;
  node.innerHTML = '<div class="uiSkin"></div><div class="uiBody"></div>';
  el.modules.appendChild(node);
  modEls.set(m.id, node);
  return node;
}
function paintModule(m, node){
  const e = effective(m);
  const t = MODULE_TYPES[e.type] || MODULE_TYPES.panel;
  applyPos(node, m);
  node.style.zIndex   = e.z;
  node.style.opacity  = e.opacity;
  node.style.transform = e.rotation ? `rotate(${e.rotation}deg)` : '';
  node.dataset.hidden = e.visible ? '0' : '1';
  const vars = moduleVars(e);
  for(const k in vars) node.style.setProperty(k, vars[k]);

  const body = node.querySelector('.uiBody');
  const l = e.layout || {}, ty = e.typography || {};
  body.style.flexDirection = l.direction || 'row';
  body.style.alignItems    = l.align || 'center';
  body.style.justifyContent= l.justify || 'flex-start';
  body.style.overflow      = l.overflow || 'hidden';
  body.style.textAlign     = ty.align || 'left';
  body.style.textTransform = ty.uppercase ? 'uppercase' : 'none';
  body.style.borderRadius  = ((e.style && e.style.radius != null) ? e.style.radius : (SkinRegistry.get(e.skinId).radius||0)) + 'px';

  const st = e.style || {};
  const px = modPx(m);
  applyNineSlice(node.querySelector('.uiSkin'), e.skinId, {
    bg:(e.colors && e.colors.bg) || null,
    border:(e.colors && e.colors.border) || null,
    radius:st.radius != null ? st.radius : null,
    borderScale:st.borderScale || 1,
    bgOpacity:st.bgOpacity == null ? 1 : st.bgOpacity,
    tint:st.tint || null, shadow:st.shadow || null,
    centerMode:st.centerMode || null, edgeMode:st.edgeMode || null,
    boxW:px.w, boxH:px.h
  });

  try { body.innerHTML = t.render ? t.render(e) : ''; }
  catch(err){ body.innerHTML = '<span class="gTiny">렌더 오류</span>'; console.warn('module render failed:', m.id, err); }
  paintMinimaps(body);
  paintSliceGuide(node, e, px);
}
/* 미니맵 캔버스 · 절차적 샘플 */
function paintMinimaps(root){
  root.querySelectorAll('[data-minimap] canvas').forEach(cv=>{
    const c = cv.getContext('2d'); if(!c) return;
    const W = cv.width, H = cv.height;
    c.clearRect(0,0,W,H); c.fillStyle = '#0a0712'; c.fillRect(0,0,W,H);
    c.strokeStyle = 'rgba(190,145,240,.32)'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(30,150); c.lineTo(70,110); c.lineTo(60,60); c.lineTo(140,70);
    c.lineTo(170,120); c.lineTo(120,150); c.stroke();
    c.fillStyle = '#7febd0'; c.beginPath(); c.arc(140,70,7,0,Math.PI*2); c.fill();
    c.fillStyle = '#f06ab8'; c.beginPath(); c.arc(30,150,5,0,Math.PI*2); c.fill();
  });
}
/* 9-Slice 경계 미리보기 */
function paintSliceGuide(node, m, px){
  const old = node.querySelector('.uiSliceGuide'); if(old) old.remove();
  if(!S.ui.sliceGuide) return;
  const sk = SkinRegistry.get(m.skinId);
  if(sk.renderer !== 'image' || !sk.slice) return;
  const bs = (m.style && m.style.borderScale) || sk.borderScale || 1;
  let L = sk.slice.left*bs, R = sk.slice.right*bs, T = sk.slice.top*bs, B = sk.slice.bottom*bs;
  if(L+R > px.w){ const f = px.w/(L+R); L*=f; R*=f; }
  if(T+B > px.h){ const f = px.h/(T+B); T*=f; B*=f; }
  const g = document.createElement('div'); g.className = 'uiSliceGuide';
  g.innerHTML =
    `<i style="left:${L}px;top:0;bottom:0;width:1px"></i>` +
    `<i style="right:${R}px;top:0;bottom:0;width:1px"></i>` +
    `<i style="top:${T}px;left:0;right:0;height:1px"></i>` +
    `<i style="bottom:${B}px;left:0;right:0;height:1px"></i>`;
  node.appendChild(g);
}

function renderStage(){
  const list = mods();
  const alive = new Set(list.map(m=>m.id));
  modEls.forEach((node,id)=>{ if(!alive.has(id)){ node.remove(); modEls.delete(id); } });
  list.forEach(m=>{
    let node = modEls.get(m.id);
    if(!node) node = buildModule(m);
    paintModule(m, node);
  });
  renderGuides();
}
function renderGuides(){
  const g = el.guides; g.innerHTML = '';
  if(S.ui.preview) return;
  if(S.ui.guides){
    const add = (cls,st)=>{ const d = document.createElement('div'); d.className = cls; d.setAttribute('style',st); g.appendChild(d); };
    add('gdLine','left:50%;top:0;bottom:0;width:1px');
    add('gdLine','top:50%;left:0;right:0;height:1px');
    [33.3333,66.6667].forEach(p=>{
      add('gdThird',`left:${p}%;top:0;bottom:0;width:1px`);
      add('gdThird',`top:${p}%;left:0;right:0;height:1px`);
    });
  }
  const sa = SAFE_AREAS[S.data.viewport.safeArea];
  if(sa && (sa.inset.l||sa.inset.t||sa.inset.r||sa.inset.b)){
    const d = document.createElement('div'); d.className = 'gdSafe';
    d.style.cssText = `left:${sa.inset.l}px;top:${sa.inset.t}px;right:${sa.inset.r}px;bottom:${sa.inset.b}px`;
    g.appendChild(d);
  }
}

/* ── 오버레이: 선택 박스 / 핸들 / 스냅 가이드 ── */
let _snapLines = [];
const HANDLE_DIRS = ['nw','n','ne','e','se','s','sw','w'];
function renderOverlay(){
  const o = el.overlay; o.innerHTML = '';
  if(S.ui.preview) return;
  const k = _scale;
  const sel = selMods();

  if(S.ui.hover && !sel.some(m=>m.id===S.ui.hover)){
    const hm = findMod(S.ui.hover);
    if(hm && hm.visible){ const p = modPx(hm);
      const d = document.createElement('div'); d.className = 'hoverBox';
      d.style.cssText = `left:${p.x*k}px;top:${p.y*k}px;width:${p.w*k}px;height:${p.h*k}px`; o.appendChild(d); }
  }

  sel.forEach((m,i)=>{
    const p = modPx(m), last = i === sel.length-1;
    const box = document.createElement('div');
    box.className = 'selBox' + (sel.length>1 && !last ? ' multi' : '');
    box.style.cssText = `left:${p.x*k}px;top:${p.y*k}px;width:${p.w*k}px;height:${p.h*k}px`;
    o.appendChild(box);
    const bd = document.createElement('div'); bd.className = 'badge';
    bd.style.cssText = `left:${p.x*k}px;top:${Math.max(0,p.y*k-15)}px`;
    bd.textContent = m.id + (m.locked ? ' 🔒' : '') + (m.visible ? '' : ' (숨김)');
    o.appendChild(bd);
    if(last && !m.locked && sel.length === 1){
      HANDLE_DIRS.forEach(dir=>{
        const h = document.createElement('div');
        h.className = 'hnd ' + dir; h.dataset.dir = dir;
        h.setAttribute('tabindex','-1'); h.setAttribute('aria-hidden','true');
        const hx = dir.includes('w') ? p.x : dir.includes('e') ? p.x+p.w : p.x+p.w/2;
        const hy = dir.includes('n') ? p.y : dir.includes('s') ? p.y+p.h : p.y+p.h/2;
        h.style.left = (hx*k)+'px'; h.style.top = (hy*k)+'px';
        o.appendChild(h);
      });
    }
  });

  _snapLines.forEach(s=>{
    const d = document.createElement('div');
    if(s.axis === 'x'){ d.className = 'snapv'; d.style.left = (s.v*k)+'px'; }
    else { d.className = 'snaph'; d.style.top = (s.v*k)+'px'; }
    o.appendChild(d);
  });
}

/* 화면/안전영역 이탈 경고 (값을 자동으로 바꾸지 않는다 — 명세 §11) */
function computeWarnings(){
  const out = [];
  const sa = SAFE_AREAS[S.data.viewport.safeArea] || SAFE_AREAS.none;
  mods().forEach(m=>{
    if(!m.visible) return;
    const p = modPx(m);
    if(p.x < -0.5 || p.y < -0.5 || p.x+p.w > vpW()+0.5 || p.y+p.h > vpH()+0.5) out.push({id:m.id, k:'화면 밖'});
    else if(p.x < sa.inset.l-0.5 || p.y < sa.inset.t-0.5 ||
            p.x+p.w > vpW()-sa.inset.r+0.5 || p.y+p.h > vpH()-sa.inset.b+0.5) out.push({id:m.id, k:'안전영역 밖'});
    if((m.typography.size||12) < A11Y_MIN_FONT) out.push({id:m.id, k:'글자 10px 미만'});
  });
  return out;
}

/* ── 전체 렌더 파이프라인 ── */
let _raf = 0;
function scheduleRender(){ if(_raf) return; _raf = requestAnimationFrame(()=>{ _raf = 0; fullRender(); }); }
function fullRender(){
  applyThemeVars(); layoutStage(); renderStage(); renderOverlay();
  renderSceneList(); renderTree(); renderInspector(); updateStatus();
}
function lightRender(){ renderStage(); renderOverlay(); updateStatus(); }

/* ════════════════════════════════════════════════════════════════════════
   9. SELECTION / DRAG / RESIZE CONTROLLER
   ════════════════════════════════════════════════════════════════════════ */
function stagePoint(ev){
  const r = el.sizer.getBoundingClientRect();
  return { x:(ev.clientX - r.left)/_scale, y:(ev.clientY - r.top)/_scale };
}
function hitTest(pt){
  const list = mods().filter(m=>m.visible && !m.locked).slice().sort((a,b)=>(b.z-a.z) || 0);
  for(const m of list){
    const p = modPx(m);
    if(pt.x >= p.x && pt.x <= p.x+p.w && pt.y >= p.y && pt.y <= p.y+p.h) return m;
  }
  return null;
}
function select(ids, additive){
  if(!Array.isArray(ids)) ids = ids ? [ids] : [];
  if(additive){
    ids.forEach(id=>{ const i = S.ui.sel.indexOf(id); if(i >= 0) S.ui.sel.splice(i,1); else S.ui.sel.push(id); });
  } else S.ui.sel = ids.slice();
  renderOverlay(); renderTree(); renderInspector(); updateStatus();
}

/* ── 스냅 타깃 수집 ── */
function snapTargets(exclude){
  const sa = SAFE_AREAS[S.data.viewport.safeArea] || SAFE_AREAS.none;
  const xs = [0, vpW()/2, vpW(), sa.inset.l, vpW()-sa.inset.r, vpW()/3, vpW()*2/3];
  const ys = [0, vpH()/2, vpH(), sa.inset.t, vpH()-sa.inset.b, vpH()/3, vpH()*2/3];
  mods().forEach(m=>{
    if(exclude.has(m.id) || !m.visible) return;
    const p = modPx(m);
    xs.push(p.x, p.x+p.w/2, p.x+p.w);
    ys.push(p.y, p.y+p.h/2, p.y+p.h);
  });
  return { xs, ys };
}
function snapDelta(vals, targets, tol){
  let best = null;
  vals.forEach(v=>{
    targets.forEach(t=>{
      const d = t - v;
      if(Math.abs(d) <= tol && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, line:t };
    });
  });
  return best;
}

let drag = null;
el.sizer.addEventListener('pointerdown', ev=>{
  if(S.ui.preview) return;
  if(ev.target.classList.contains('hnd')) return;     // 핸들은 자체 처리
  if(ev.target === el.inline) return;
  const pt = stagePoint(ev);
  const hit = hitTest(pt);
  if(!hit){ if(!ev.shiftKey) select([]); return; }
  if(ev.shiftKey){ select([hit.id], true); return; }
  if(S.ui.sel.indexOf(hit.id) < 0) select([hit.id]);
  const targets = selMods().filter(m=>!m.locked);
  if(!targets.length) return;
  drag = { mode:'move', start:pt, moved:false, ex:new Set(targets.map(m=>m.id)),
           orig:targets.map(m=>({ m, abs:absOf(m), px:modPx(m) })) };
  try{ el.sizer.setPointerCapture(ev.pointerId); }catch(_){}
  ev.preventDefault();
});
el.sizer.addEventListener('pointermove', ev=>{
  if(!drag){
    if(!S.ui.preview){
      const h = hitTest(stagePoint(ev));
      const id = h ? h.id : null;
      if(id !== S.ui.hover){ S.ui.hover = id; renderOverlay(); }
    }
    return;
  }
  const pt = stagePoint(ev);
  let dx = pt.x - drag.start.x, dy = pt.y - drag.start.y;
  if(Math.abs(dx) > 1 || Math.abs(dy) > 1) drag.moved = true;
  if(drag.mode === 'move'){
    _snapLines = [];
    if(S.ui.snap && !ev.altKey){
      const t = snapTargets(drag.ex), p0 = drag.orig[0].px;
      const sx = snapDelta([p0.x+dx, p0.x+p0.w/2+dx, p0.x+p0.w+dx], t.xs, SNAP_TOL);
      const sy = snapDelta([p0.y+dy, p0.y+p0.h/2+dy, p0.y+p0.h+dy], t.ys, SNAP_TOL);
      if(sx){ dx += sx.d; _snapLines.push({axis:'x', v:sx.line}); }
      if(sy){ dy += sy.d; _snapLines.push({axis:'y', v:sy.line}); }
    }
    drag.orig.forEach(o=>{
      const p = { x:o.px.x+dx, y:o.px.y+dy, w:o.px.w, h:o.px.h };
      setAbs(o.m, pxToAbs(p));
      const node = modEls.get(o.m.id); if(node) applyPos(node, o.m);
    });
  } else {
    resizeStep(drag, pt, ev);
  }
  renderOverlay(); syncInspectorRect();
});
function endDrag(ev){
  if(!drag) return;
  const moved = drag.moved, mode = drag.mode;
  drag = null; _snapLines = [];
  try{ el.sizer.releasePointerCapture(ev.pointerId); }catch(_){}
  if(moved){ if(mode === 'resize') renderStage(); History.push(); }   // pointerup 에서 1단계만 기록
  renderOverlay(); renderInspector(); updateStatus();
}

/* 리사이즈 핸들 */
el.overlay.addEventListener('pointerdown', ev=>{
  const h = ev.target.closest('.hnd'); if(!h) return;
  const m = primary(); if(!m || m.locked) return;
  drag = { mode:'resize', dir:h.dataset.dir, start:stagePoint(ev), moved:false,
           ex:new Set([m.id]), m, px:modPx(m) };
  try{ el.sizer.setPointerCapture(ev.pointerId); }catch(_){}
  ev.preventDefault(); ev.stopPropagation();
});
function resizeStep(d, pt, ev){
  const dir = d.dir, o = d.px, m = d.m;
  let dx = pt.x - d.start.x, dy = pt.y - d.start.y;
  _snapLines = [];
  if(S.ui.snap && !ev.altKey){
    const t = snapTargets(d.ex);
    if(dir.includes('w')){ const s = snapDelta([o.x+dx], t.xs, SNAP_TOL); if(s){ dx += s.d; _snapLines.push({axis:'x',v:s.line}); } }
    if(dir.includes('e')){ const s = snapDelta([o.x+o.w+dx], t.xs, SNAP_TOL); if(s){ dx += s.d; _snapLines.push({axis:'x',v:s.line}); } }
    if(dir.includes('n')){ const s = snapDelta([o.y+dy], t.ys, SNAP_TOL); if(s){ dy += s.d; _snapLines.push({axis:'y',v:s.line}); } }
    if(dir.includes('s')){ const s = snapDelta([o.y+o.h+dy], t.ys, SNAP_TOL); if(s){ dy += s.d; _snapLines.push({axis:'y',v:s.line}); } }
  }
  let x = o.x, y = o.y, w = o.w, h = o.h;
  const alt = ev.altKey;                              // 중심 기준
  if(dir.includes('e')) w = o.w + dx * (alt?2:1);
  if(dir.includes('w')){ w = o.w - dx * (alt?2:1); if(!alt) x = o.x + dx; }
  if(dir.includes('s')) h = o.h + dy * (alt?2:1);
  if(dir.includes('n')){ h = o.h - dy * (alt?2:1); if(!alt) y = o.y + dy; }

  const mn = minSizePx(m), mx = maxSizePx(m);
  w = clamp(w, mn.w, mx.w); h = clamp(h, mn.h, mx.h);

  if((ev.shiftKey || m.keepAspect) && o.w > 0 && o.h > 0){   // 종횡비 고정
    const ar = o.w / o.h;
    if(dir === 'n' || dir === 's') w = clamp(h * ar, mn.w, mx.w);
    else if(dir === 'e' || dir === 'w') h = clamp(w / ar, mn.h, mx.h);
    else { h = clamp(w / ar, mn.h, mx.h); w = clamp(h * ar, mn.w, mx.w); }
    if(dir.includes('w') && !alt) x = o.x + o.w - w;
    if(dir.includes('n') && !alt) y = o.y + o.h - h;
  } else {
    if(dir.includes('w') && !alt) x = o.x + o.w - w;
    if(dir.includes('n') && !alt) y = o.y + o.h - h;
  }
  if(alt){ x = o.x + o.w/2 - w/2; y = o.y + o.h/2 - h/2; }

  setAbs(m, pxToAbs({x,y,w,h}));
  const node = modEls.get(m.id);
  if(node){ applyPos(node, m); const p = modPx(m);
    applyNineSlice(node.querySelector('.uiSkin'), effective(m).skinId, {
      bg:(m.colors&&m.colors.bg)||null, border:(m.colors&&m.colors.border)||null,
      radius:m.style.radius, borderScale:m.style.borderScale||1,
      bgOpacity:m.style.bgOpacity, tint:m.style.tint, shadow:m.style.shadow,
      centerMode:m.style.centerMode, edgeMode:m.style.edgeMode, boxW:p.w, boxH:p.h });
    paintSliceGuide(node, effective(m), p);
  }
}

function getP(o, path){ return path.split('.').reduce((a,k)=> (a == null ? a : a[k]), o); }
function setP(o, path, v){
  const ks = path.split('.'); let a = o;
  for(let i=0;i<ks.length-1;i++){ if(a[ks[i]] == null || typeof a[ks[i]] !== 'object') a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks[ks.length-1]] = v;
}
/* 선택된 모든 모듈에 공통 속성을 적용 (다중 선택 시 공통 편집) */
function editAll(path, v, opt){
  const list = selMods().filter(m=>!m.locked || (opt && opt.allowLocked));
  if(!list.length) return;
  list.forEach(m=>setP(m, path, v));
  if(opt && opt.heavy) renderStage(); else lightRender();
  renderOverlay();
}
function commitEdit(){ History.push(); renderStage(); renderOverlay(); updateStatus(); }

/* ── 컨트롤 팩토리 ── */
function wrapField(labelText, input){
  const d = document.createElement('div');
  if(labelText){ const l = document.createElement('label'); l.textContent = labelText; d.appendChild(l); }
  d.appendChild(input); return d;
}
function fNum(path, label, o){
  o = o || {};
  const i = document.createElement('input'); i.type = 'number';
  if(o.min != null) i.min = o.min; if(o.max != null) i.max = o.max;
  i.step = o.step == null ? 1 : o.step;
  const p = primary(); i.value = p ? (getP(p, path) == null ? '' : getP(p, path)) : '';
  i.setAttribute('aria-label', label);
  i.addEventListener('input', ()=>{ if(i.value === '') return; editAll(path, r3(+i.value), o); });
  i.addEventListener('change', commitEdit);
  if(o.ref) o.ref(i);
  return wrapField(label, i);
}
function fTxt(path, label, o){
  o = o || {};
  const i = document.createElement('input'); i.type = 'text';
  const p = primary(); i.value = p ? (getP(p, path) == null ? '' : getP(p, path)) : '';
  i.setAttribute('aria-label', label);
  i.addEventListener('input', ()=>editAll(path, i.value, o));

}
function fArea(path, label, rows, o){
  o = o || {};
  const i = document.createElement('textarea'); i.rows = rows || 4;
  const p = primary(); i.value = p ? (getP(p, path) == null ? '' : getP(p, path)) : '';
  i.setAttribute('aria-label', label);

  return wrapField(label, i);
}
function fSel(path, label, options, o){
  o = o || {};
  const i = document.createElement('select');
  options.forEach(op=>{ const t = document.createElement('option');
    t.value = op.v; t.textContent = op.t; i.appendChild(t); });
  const p = primary(); if(p) i.value = getP(p, path);
  i.setAttribute('aria-label', label);
  i.addEventListener('change', ()=>{ editAll(path, i.value, o); commitEdit(); });
  return wrapField(label, i);
}
function fChk(path, label, o){
  o = o || {};
  const l = document.createElement('label'); l.className = 'chk';
  const i = document.createElement('input'); i.type = 'checkbox';
  const p = primary(); i.checked = !!(p && getP(p, path));
  i.addEventListener('change', ()=>{ editAll(path, i.checked, Object.assign({allowLocked:true}, o)); commitEdit(); });
  l.appendChild(i); l.appendChild(document.createTextNode(label));
  return l;
}
function fRange(path, label, min, max, step, o){
  o = o || {};
  const wrapEl = document.createElement('div');
  const lab = document.createElement('label');
  const i = document.createElement('input'); i.type = 'range';
  i.min = min; i.max = max; i.step = step;
  const p = primary(); const cur = p ? getP(p, path) : min;
  i.value = cur == null ? max : cur;
  lab.textContent = label + ' · ' + (+i.value).toFixed(2);
  i.setAttribute('aria-label', label);
  i.addEventListener('input', ()=>{ lab.textContent = label + ' · ' + (+i.value).toFixed(2); editAll(path, +i.value, o); });
  i.addEventListener('change', commitEdit);
  wrapEl.appendChild(lab); wrapEl.appendChild(i); return wrapEl;
}
function fColor(path, label, inherited){
  const row = document.createElement('div'); row.className = 'colorRow';
  const p = primary(); const cur = p ? getP(p, path) : null;
  const c = document.createElement('input'); c.type = 'color';
  c.value = /^#[0-9a-f]{6}$/i.test(cur || '') ? cur : (/^#[0-9a-f]{6}$/i.test(inherited||'') ? inherited : '#888888');
  c.setAttribute('aria-label', label + ' 색상 선택');

  t.value = cur == null ? '' : cur; t.placeholder = inherited ? ('상속 ' + inherited) : '상속';
  t.setAttribute('aria-label', label + ' 색상 값');
  c.addEventListener('input', ()=>{ t.value = c.value; editAll(path, c.value); });

  row.appendChild(l); row.appendChild(c); row.appendChild(t); row.appendChild(r);

function fSeg(path, label, options, o){

   ════════════════════════════════════════════════════════════════════════ */
const slicer = {
  img:null, url:null, name:'', natural:{w:0,h:0},
  slice:{left:24,top:24,right:24,bottom:24},
  centerMode:'stretch', edgeMode:'stretch', borderScale:1,
  skinId:'panelCustom', path:'assets/ui/nine-slice/panel-custom.png'
};
function buildSliceTab(box){
  const g = grp('PNG 리소스 선택');
  const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/png,image/*';
  fi.setAttribute('aria-label','9-Slice PNG 파일 선택');
  fi.addEventListener('change', ()=>{
    const f = fi.files && fi.files[0]; if(!f) return;
    if(slicer.url) URL.revokeObjectURL(slicer.url);
    slicer.url = URL.createObjectURL(f); slicer.name = f.name;
    const im = new Image();
    im.onload = ()=>{
      slicer.img = im; slicer.natural = { w:im.naturalWidth, h:im.naturalHeight };
      const q = Math.max(4, Math.round(Math.min(im.naturalWidth, im.naturalHeight) / 4));
      slicer.slice = { left:q, top:q, right:q, bottom:q };
      if(!/\.(png|jpe?g|webp)$/i.test(slicer.path)) slicer.path = 'assets/ui/nine-slice/' + f.name;
      else slicer.path = 'assets/ui/nine-slice/' + f.name;
      renderInspector();
    };
    im.onerror = ()=>{ toast('이미지를 읽지 못했습니다', true); };
    im.src = slicer.url;
  });
  g.appendChild(wrapField('PNG 파일 (미리보기 전용 · JSON에는 저장되지 않음)', fi));
  const gen = document.createElement('div'); gen.className = 'segs'; gen.style.marginTop = '6px';
  [['forge','내장 forge 128²'],['rivet','내장 rivet 96²']].forEach(([k,t])=>{
    const b = document.createElement('button'); b.textContent = t;
    b.addEventListener('click', ()=>{
      const im = new Image();
      im.onload = ()=>{ slicer.img = im; slicer.natural = {w:im.naturalWidth,h:im.naturalHeight};
        const sk = k === 'rivet' ? BUILTIN_SKINS.panelRivet : BUILTIN_SKINS.panelForge;
        slicer.slice = Object.assign({}, sk.slice); slicer.name = k + ' (내장 생성)';
        slicer.path = 'assets/ui/nine-slice/panel-' + k + '.png'; renderInspector(); };
      im.src = generatedSkinSource(k);
    });
    gen.appendChild(b);
  });
  g.appendChild(gen);
  if(slicer.img){
    const d = document.createElement('div'); d.className = 'hint';
    d.textContent = `${slicer.name} · 원본 ${slicer.natural.w} × ${slicer.natural.h} px`;
    g.appendChild(d);
  } else {
    g.appendChild(note('PNG를 선택하거나 내장 텍스처 버튼을 눌러 9-Slice 인셋을 시험하세요.'));
  }
  box.appendChild(g);
  if(!slicer.img) return;

  const gs = grp('인셋 (px)');
  const r = row('c4');
  ['left','top','right','bottom'].forEach(k=>{
    const i = document.createElement('input'); i.type = 'number'; i.min = 0; i.step = 1;
    i.value = slicer.slice[k]; i.setAttribute('aria-label','인셋 ' + k);
    i.addEventListener('input', ()=>{
      const lim = (k === 'left' || k === 'right') ? slicer.natural.w : slicer.natural.h;
      slicer.slice[k] = clamp(Math.round(+i.value || 0), 0, Math.max(0, lim - 1));
      drawSlicerPreviews();
    });
    r.appendChild(wrapField(k, i));
  });
  gs.appendChild(r);
  const rr = row();
  const mkSeg = (label, key, opts)=>{
    const b2 = document.createElement('div');
    const l = document.createElement('label'); l.textContent = label; b2.appendChild(l);
    const sg = document.createElement('div'); sg.className = 'segs';
    opts.forEach(v=>{ const b = document.createElement('button'); b.textContent = v;
      if(slicer[key] === v) b.className = 'on';
      b.setAttribute('aria-pressed', slicer[key] === v ? 'true':'false');
      b.addEventListener('click', ()=>{ slicer[key] = v; renderInspector(); });
      sg.appendChild(b); });
    b2.appendChild(sg); return b2;
