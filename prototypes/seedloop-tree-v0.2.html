<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<title>시드루프 알고리즘 트리 v0.2</title>
<style>
:root{--bg:#07090d;--pnl:#101620;--line:#232e3d;--tx:#e6ecf5;--tx2:#93a2b8;--tx3:#66748a;--acc:#5aa9ff;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#top{position:fixed;top:0;left:0;right:0;z-index:20;padding:10px 12px 9px;
  background:linear-gradient(180deg,rgba(7,9,13,.97),rgba(7,9,13,.82));border-bottom:1px solid var(--line);
  backdrop-filter:blur(8px)}
#top h1{margin:0;font-size:15px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
#top h1 em{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.12em;color:var(--acc);
  border:1px solid rgba(90,169,255,.4);border-radius:5px;padding:2px 6px}
#stepname{font-size:11.5px;color:var(--tx2);margin-top:4px;font-family:var(--mono);letter-spacing:.02em}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#stage svg{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;display:block}
.nd{transition:opacity .22s}
body.stepping .nd{opacity:.22}
body.stepping .nd.hi{opacity:1}
#bar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;gap:6px;align-items:center;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(7,9,13,.97),rgba(7,9,13,.8));border-top:1px solid var(--line);
  backdrop-filter:blur(8px)}
button{font-family:var(--mono);font-size:12px;background:#18202c;color:var(--tx2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;cursor:pointer;transition:.13s;white-space:nowrap}
button:active{transform:scale(.95)}
button.pri{background:rgba(90,169,255,.14);border-color:rgba(90,169,255,.45);color:#bfdcff}
#cnt{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-left:auto;padding-right:2px}
#lg{position:fixed;z-index:15;right:10px;top:62px;background:rgba(16,22,32,.93);border:1px solid var(--line);
  border-radius:11px;padding:9px 11px;font-family:var(--mono);font-size:10.5px;color:var(--tx2);line-height:1.95;
  backdrop-filter:blur(6px)}
#lg b{display:block;color:var(--tx3);font-size:9.5px;letter-spacing:.14em;margin-bottom:3px;font-weight:600}
#lg i{display:inline-block;width:9px;height:9px;border:2px solid;margin-right:6px;vertical-align:middle;border-radius:50%}
#lg i.h{border-radius:2px;transform:rotate(45deg)}
#lg.off{display:none}
#hint{position:fixed;z-index:14;left:50%;transform:translateX(-50%);bottom:62px;font-family:var(--mono);
  font-size:11px;color:var(--tx3);background:rgba(7,9,13,.85);border:1px solid var(--line);
  border-radius:20px;padding:6px 13px;transition:opacity .5s}
</style></head><body>

<script>
var GW=1330, GH=2420;
var STEPS=[["전체",0,0,1330,2420,""],["새벽 기동",466,-52,308,208,"start"],["STAGE 0 · 기억 복구",426,26,388,252,"s0"],["판정 · repo 접근",441,160,358,236,"d0"],["폴백 · 축소 모드",36,289,338,266,"reduced"],["STAGE 1 · 발굴",406,283,428,298,"s1"],["판정 · 이미 본 게임?",431,481,378,230,"d2"],["버림",51,591,248,218,"drop"],["재평가 큐",876,585,268,234,"reeval"],["판정 · 하드 게이트",421,663,398,238,"d3"],["기각 기록",51,768,308,252,"rej"],["STAGE 4 · 3축 채점",406,812,428,264,"s4"],["보류 기록",891,939,258,230,"hold"],["STAGE 5 · 심층 분석",421,968,398,252,"s5"],["판정 · PC 살아있나",426,1117,388,234,"d6"],["크롬 실제 플레이",31,1222,348,264,"play"],["play-pending",896,1222,308,264,"pend"],["STAGE 7 · 프로토 제작",406,1372,428,264,"s7"],["판정 · 게임필 게이트",421,1533,398,242,"d8"],["재시도",96,1547,218,214,"retry"],["audit-failed 기록",46,1668,318,252,"failrec"],["STAGE 9 · 커밋 · 보고",406,1692,428,264,"s9"],["DAY · 사람이 만져본다",421,1847,398,238,"morning"],["판정 · GO / 보류 / 기각",300,1982,640,302,"dj"],["↺ 되먹임 · rubric 갱신",426,2185,388,242,"rubric"]];
var stage=document.getElementById('stage'), svg=stage.querySelector('svg');
var sc=1, tx=0, ty=0, idx=0;

function vp(){ return {w:innerWidth, h:innerHeight, top:64, bot:56}; }
function apply(){ svg.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')'; }
function focusRect(x,y,w,h,pad){
  pad = pad===undefined?26:pad;
  var v=vp(), aw=v.w-pad*2, ah=v.h-v.top-v.bot-pad*2;
  sc=Math.min(aw/w, ah/h); sc=Math.max(.12,Math.min(sc,3.2));
  tx=(v.w-w*sc)/2 - x*sc;
  ty=v.top+pad+(ah-h*sc)/2 - y*sc;
  apply();
}
function hl(id){
  svg.querySelectorAll('.nd.hi').forEach(function(g){g.classList.remove('hi')});
  if(!id){ document.body.classList.remove('stepping'); return; }
  document.body.classList.add('stepping');
  var t=svg.querySelector('.nd[data-id="'+id+'"]'); if(t) t.classList.add('hi');
  if(id==='dj'){ ['go','hold2','rej2'].forEach(function(k){
    var e=svg.querySelector('.nd[data-id="'+k+'"]'); if(e) e.classList.add('hi'); }); }
}
function goStep(i){
  idx=(i+STEPS.length)%STEPS.length;
  var s=STEPS[idx];
  focusRect(s[1],s[2],s[3],s[4], idx===0?14:6);
  hl(s[5]);
  document.getElementById('stepname').textContent =
    (idx===0? '전체 — 단계 ▶ 로 하나씩, 노드를 눌러도 이동'
            : s[0]);
  document.getElementById('cnt').textContent = idx===0? '' : idx+' / '+(STEPS.length-1);
  document.getElementById('lg').classList.toggle('off', idx!==0 && !lgPin);
}
var lgPin=false;
document.getElementById('next').onclick=function(){goStep(idx+1)};
document.getElementById('prev').onclick=function(){goStep(idx-1)};
document.getElementById('fit').onclick=function(){goStep(0)};
document.getElementById('lgt').onclick=function(){
  var off=document.getElementById('lg').classList.toggle('off'); lgPin=!off;};
function zoomAt(k,cx,cy){
  var ns=Math.max(.1,Math.min(3.6,sc*k));
  tx=cx-(cx-tx)*(ns/sc); ty=cy-(cy-ty)*(ns/sc); sc=ns; apply();
}
document.getElementById('zi').onclick=function(){zoomAt(1.35,innerWidth/2,innerHeight/2)};
document.getElementById('zo').onclick=function(){zoomAt(1/1.35,innerWidth/2,innerHeight/2)};

/* 노드 탭 → 그 노드로 이동 */
svg.querySelectorAll('.nd').forEach(function(g){
  g.style.cursor='pointer';
  g.addEventListener('click',function(ev){
    if(moved) return;
    var id=g.dataset.id;
    for(var i=1;i<STEPS.length;i++){ if(STEPS[i][5]===id){ goStep(i); return; } }
    var x=+g.dataset.x,y=+g.dataset.y,w=+g.dataset.w,h=+g.dataset.h;
    focusRect(x-24,y-80,w+48,h+160,6); hl(id);
    document.getElementById('stepname').textContent='선택한 노드 — 「전체」로 돌아가기';
  });
});

/* pan + pinch */
var pts={}, moved=false, last=null, pd0=0, sc0=1, mid0=null;
stage.addEventListener('pointerdown',function(e){
  stage.setPointerCapture(e.pointerId);
  pts[e.pointerId]={x:e.clientX,y:e.clientY}; moved=false;
  var k=Object.keys(pts);
  if(k.length===1){ last={x:e.clientX,y:e.clientY}; stage.classList.add('drag'); }
  else if(k.length===2){ var a=pts[k[0]],b=pts[k[1]];
    pd0=Math.hypot(a.x-b.x,a.y-b.y); sc0=sc; mid0={x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
});
stage.addEventListener('pointermove',function(e){
  if(!pts[e.pointerId]) return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var k=Object.keys(pts);
  if(k.length===1&&last){
    var dx=e.clientX-last.x, dy=e.clientY-last.y;
    if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
    tx+=dx; ty+=dy; last={x:e.clientX,y:e.clientY}; apply();
  } else if(k.length===2){
    var a=pts[k[0]],b=pts[k[1]], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pd0>0){ moved=true;
      var ns=Math.max(.1,Math.min(3.6,sc0*d/pd0));
      tx=mid0.x-(mid0.x-tx)*(ns/sc); ty=mid0.y-(mid0.y-ty)*(ns/sc); sc=ns; apply(); }
  }
});
function up(e){ delete pts[e.pointerId];
  if(!Object.keys(pts).length){ last=null; stage.classList.remove('drag'); } }
stage.addEventListener('pointerup',up);
stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',function(e){ e.preventDefault();
  zoomAt(e.deltaY<0?1.12:1/1.12, e.clientX, e.clientY); },{passive:false});

goStep(0);
setTimeout(function(){var h=document.getElementById('hint'); h.style.opacity=0;},3200);
addEventListener('resize',function(){goStep(idx)});
</script></body></html>
