<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>땅굴크루 v7.7 UI 그레이박스</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#141416; color:#ddd; font-family:'Segoe UI','Malgun Gothic',sans-serif; overflow:hidden; }
  #toolbar { position:fixed; top:0; left:0; right:0; background:#1d1d21; border-bottom:1px solid #333; z-index:10; padding:6px 12px; }
  .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:3px 0; }
  .lbl { font-size:11px; color:#888; margin:0 6px 0 10px; letter-spacing:1px; }
  button { background:#2a2a30; color:#bbb; border:1px solid #444; padding:5px 12px; font-size:12.5px; cursor:pointer; border-radius:4px; }
  button.on { background:#4a6a5a; color:#fff; border-color:#6a9a80; }
  button.tab.on { background:#5a4a2a; border-color:#a8843a; }
  button.warn { background:#5a3a2a; border-color:#a86a3a; color:#f0d0b0; }
  #stageWrap { position:fixed; top:96px; left:0; right:340px; bottom:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:1280px; height:720px; background:#3a3a3e; outline:2px solid #555; transform-origin:center center; flex:none; }
  .world { position:absolute; inset:0; background:repeating-linear-gradient(45deg,#38383c 0 24px,#333337 24px 48px); }
  .worldLabel { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#55555a; font-size:26px; letter-spacing:6px; font-weight:700; }
  .gb { position:absolute; background:rgba(160,160,165,.22); border:1.5px dashed #9a9aa0; color:#e8e8ec;
    font-size:12px; line-height:1.45; padding:6px 9px; border-radius:4px; cursor:pointer; }
  .gb:hover { background:rgba(180,180,190,.32); border-color:#c8c8d0; }
  .gb b { font-size:12.5px; display:block; }
  .gb .sub { color:#b8b8be; font-size:10.5px; display:block; }
  .gb .num { position:absolute; top:-11px; left:-11px; width:22px; height:22px; border-radius:50%;
    background:#e8b04a; color:#1a1a1a; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .gb.ctx { border-color:#e8b04a; background:rgba(232,176,74,.14); }
  .gb.faded { opacity:.4; }
  .gb.vert { writing-mode:vertical-rl; text-align:center; }
  .cbadge { position:absolute; top:-12px; right:-12px; width:24px; height:24px; border-radius:50% 50% 50% 4px;
    background:#7fd0a8; color:#10241a; font-size:13px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .bar { height:8px; background:#666; border-radius:4px; margin-top:4px; position:relative; overflow:hidden; }
  .bar i { position:absolute; inset:0; background:#aaa; display:block; }
  .segs { display:flex; gap:2px; margin-top:4px; }
  .segs i { width:9px; height:9px; background:#aaa; border-radius:2px; display:block; }
  .segs i.off { background:#555; }
  .slot { display:inline-flex; width:44px; height:44px; background:rgba(200,200,205,.2); border:1.5px solid #9a9aa0;
    border-radius:8px; align-items:center; justify-content:center; font-size:11px; color:#ddd; flex-direction:column; gap:1px; }
  .slot small { font-size:9px; color:#999; }
  .safeline { position:absolute; inset:32px; border:1px dotted rgba(120,180,220,.4); pointer-events:none; }
  .safetag { position:absolute; top:34px; left:38px; font-size:10px; color:rgba(120,180,220,.7); pointer-events:none; }
  #notes { position:fixed; top:96px; right:0; width:340px; bottom:0; background:#1a1a1e; border-left:1px solid #333;
    padding:16px; overflow-y:auto; font-size:12.5px; line-height:1.6; }
  #notes h2 { font-size:14px; color:#e8b04a; margin-bottom:10px; }
  #notes .note { margin-bottom:11px; display:flex; gap:8px; }
  #notes .note .n { flex:none; width:20px; height:20px; border-radius:50%; background:#e8b04a; color:#1a1a1a;
    font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:2px; }
  #notes .note.diag .n { background:#c86a5a; color:#fff; }
  #notes .note p { color:#c8c8cd; }
  #notes .note p b { color:#fff; }
  #notes .tip { background:#22282a; border:1px solid #3a4a44; border-radius:6px; padding:8px 10px; color:#9ec8b0;
    font-size:11.5px; margin-bottom:14px; }
  .hidden { display:none !important; }
  /* comment popup & export modal */
  .modalBack { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; display:flex; align-items:center; justify-content:center; }
  .modalBox { background:#222228; border:1px solid #555; border-radius:10px; padding:18px; width:460px; max-width:92vw;
    box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .modalBox h3 { font-size:14px; color:#7fd0a8; margin-bottom:4px; }
  .modalBox .where { font-size:11px; color:#888; margin-bottom:10px; }
  .modalBox textarea { width:100%; height:110px; background:#1a1a1e; color:#ddd; border:1px solid #444; border-radius:6px;
    padding:8px; font-size:13px; font-family:inherit; resize:vertical; }
  .modalBox textarea.json { height:300px; font-family:ui-monospace,Consolas,monospace; font-size:11px; white-space:pre; }
  .modalRow { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
</style>
</head>
<body>
<div id="toolbar">
  <div class="row" id="screenTabs"><span class="lbl">화면</span></div>
  <div class="row">
    <span class="lbl">레이아웃</span>
    <button id="btnCur" onclick="setLayout('cur')">현재</button>
    <button id="btnNew" class="on" onclick="setLayout('new')">제안</button>
    <span id="stateGrp"><span class="lbl">상황</span>
      <button id="btnIdle" class="on" onclick="setMode('idle')">탐사</button>
      <button id="btnCombat" onclick="setMode('combat')">전투</button>
      <button id="btnBoss" onclick="setMode('boss')">보스</button>
    </span>
    <span class="lbl">가이드</span>
    <button id="btnSafe" class="on" onclick="toggleSafe()">세이프 에어리어</button>
    <span class="lbl">코멘트</span>
    <button id="btnExport" class="warn" onclick="openExport()">💬 <span id="cCount">0</span>개 · JSON 내보내기</button>
    <button onclick="clearComments()">전체 삭제</button>
  </div>
</div>

<div id="stageWrap"><div id="stage">
  <div class="world"><div class="worldLabel" id="worldLabel">1280×720</div></div>
  <div id="boxes"></div>
  <div class="safeline" id="safeline"></div><div class="safetag" id="safetag">SAFE AREA 32px</div>
</div></div>

<div id="notes">
  <div class="tip">💬 <b>그레이박스 요소를 클릭하면 코멘트 말풍선</b>이 열립니다. 남긴 코멘트는 저장되며, 상단 <b>JSON 내보내기</b>로 한 번에 모아 Claude에게 전달할 수 있습니다.</div>
  <h2 id="noteTitle"></h2>
  <div id="noteList"></div>
</div>

<!-- 코멘트 말풍선 -->
<div class="modalBack hidden" id="cpop">
  <div class="modalBox">
    <h3 id="cpopTitle">코멘트</h3>
    <div class="where" id="cpopWhere"></div>
    <textarea id="cpopText" placeholder="이 요소에 대한 코멘트를 남겨주세요…"></textarea>
    <div class="modalRow">
      <button onclick="deleteComment()">삭제</button>
      <button onclick="closeComment()">취소</button>
      <button class="on" onclick="saveComment()">저장</button>
    </div>
  </div>
</div>

<!-- JSON 내보내기 -->
<div class="modalBack hidden" id="expop">
  <div class="modalBox" style="width:640px;">
    <h3>코멘트 JSON 내보내기</h3>
    <div class="where">아래 JSON을 복사해서 Claude에게 붙여넣으세요. (localStorage에도 저장되어 있습니다)</div>
    <textarea class="json" id="expText" readonly></textarea>
    <div class="modalRow">
      <button onclick="copyExport()" id="btnCopy">클립보드 복사</button>
      <button class="on" onclick="document.getElementById('expop').classList.add('hidden')">닫기</button>
    </div>
  </div>
</div>

/* ============ 상태 ============ */
const ORDER=['main-menu','mode-select','hud','crew-hud','levelup','settlement','nodemap','relic','starmap','pause'];
let curScreen='main-menu', curLayout='new', mode='idle', safe=true;
const CKEY='tcGraybox77Comments';
let store={}; try{ store=JSON.parse(localStorage.getItem(CKEY)||'{}'); }catch(e){ store={}; }
let editing=null;

/* ============ 렌더 ============ */
const tabs=document.getElementById('screenTabs');
ORDER.forEach(id=>{
  const b=document.createElement('button'); b.className='tab'; b.textContent=SCREENS[id].name;
  b.onclick=()=>{ curScreen=id; render(); }; b.dataset.scr=id; tabs.appendChild(b);
});

function ckey(id){ return curScreen+'|'+curLayout+'|'+id; }

function render(){
  const scr=SCREENS[curScreen];
  document.querySelectorAll('#screenTabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.scr===curScreen));
  document.getElementById('btnCur').classList.toggle('on',curLayout==='cur');
  document.getElementById('btnNew').classList.toggle('on',curLayout==='new');
  document.getElementById('stateGrp').style.display=(scr.states&&curLayout==='new')?'':'none';
  ['Idle','Combat','Boss'].forEach(x=>document.getElementById('btn'+x).classList.toggle('on',mode===x.toLowerCase()));
  document.getElementById('worldLabel').textContent=scr.name+' · 1280×720';
  const wrap=document.getElementById('boxes'); wrap.innerHTML='';
  (scr.layouts[curLayout]||[]).forEach(row=>{
    const [id,x,y,w,h,t,s]=row; const o=row[7]||{};
    if(scr.states&&curLayout==='new'&&o.modes&&!o.modes.includes(mode)) return;
    const d=document.createElement('div'); d.className='gb';
    if(o.ctx)d.classList.add('ctx');
    if(o.faded||(scr.states&&curLayout==='new'&&mode==='idle'&&o.fadeIdle))d.classList.add('faded');
    if(o.vert)d.classList.add('vert');
    d.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;';
    let inner='';
    if(o.num)inner+='<span class="num">'+o.num+'</span>';
    if(o.htmlFn)inner+=o.htmlFn(mode); else if(o.html)inner+=o.html;
    else{ if(t)inner+='<b>'+t+'</b>'; if(s)inner+='<span class="sub">'+s+'</span>'; }
    if(store[ckey(id)])inner+='<span class="cbadge">💬</span>';
    d.innerHTML=inner;
    d.onclick=ev=>{ ev.stopPropagation(); openComment(id,t||id); };
    wrap.appendChild(d);
  });
  // notes
  document.getElementById('noteTitle').textContent=scr.name+' — '+(curLayout==='new'?'제안 노트':'현재 진단');
  const nl=document.getElementById('noteList'); nl.innerHTML='';
  (scr.notes[curLayout]||[]).forEach(n=>{
    const div=document.createElement('div');
    if(Array.isArray(n)){ div.className='note'; div.innerHTML='<span class="n">'+n[0]+'</span><p>'+n[1]+'</p>'; }
    else { div.className='note diag'; div.innerHTML='<span class="n">!</span><p>'+n+'</p>'; }
    nl.appendChild(div);
  });
  updateCount();
}

function setLayout(l){ curLayout=l; render(); }
function setMode(m){ mode=m; render(); }
function toggleSafe(){ safe=!safe;
  document.getElementById('safeline').classList.toggle('hidden',!safe);
  document.getElementById('safetag').classList.toggle('hidden',!safe);
  document.getElementById('btnSafe').classList.toggle('on',safe);
}

/* ============ 코멘트 ============ */
function openComment(id,label){
  editing={id,label};
  document.getElementById('cpopTitle').textContent='💬 '+label;
  document.getElementById('cpopWhere').textContent=SCREENS[curScreen].name+' · '+(curLayout==='new'?'제안':'현재')+' 레이아웃 · 요소 id: '+id;
  document.getElementById('cpopText').value=(store[ckey(id)]||{}).text||'';
  document.getElementById('cpop').classList.remove('hidden');
  document.getElementById('cpopText').focus();
}
function closeComment(){ document.getElementById('cpop').classList.add('hidden'); editing=null; }
function saveComment(){
  if(!editing)return;
  const txt=document.getElementById('cpopText').value.trim();
  const k=ckey(editing.id);
  if(txt) store[k]={screen:curScreen,screenName:SCREENS[curScreen].name,layout:curLayout,element:editing.id,label:editing.label,text:txt,updatedAt:new Date().toISOString()};
  else delete store[k];
  persist(); closeComment(); render();
}
function deleteComment(){
  if(!editing)return; delete store[ckey(editing.id)]; persist(); closeComment(); render();
}
function clearComments(){
  if(!confirm('모든 코멘트를 삭제할까요?'))return;
  store={}; persist(); render();
}
function persist(){ localStorage.setItem(CKEY,JSON.stringify(store)); }
function updateCount(){ document.getElementById('cCount').textContent=Object.keys(store).length; }

/* ============ 내보내기 ============ */
function exportJSON(){
  return JSON.stringify({exportedAt:new Date().toISOString(),tool:'tunnel-crew-ui-graybox-v7.7',comments:Object.values(store)},null,2);
}
function openExport(){
  document.getElementById('expText').value=exportJSON();
  document.getElementById('expop').classList.remove('hidden');
}
function copyExport(){
  const ta=document.getElementById('expText'); ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    const b=document.getElementById('btnCopy'); b.textContent='복사됨 ✓'; setTimeout(()=>b.textContent='클립보드 복사',1500);
  }).catch(()=>document.execCommand('copy'));
}

/* ============ 핏 ============ */
function fit(){ const w=innerWidth-340, h=innerHeight-96;
  document.getElementById('stage').style.transform='scale('+Math.min(w/1320,h/760)+')';
}
addEventListener('resize',fit); fit(); render();
</script>
</body>
